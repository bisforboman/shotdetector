version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows and our composite actions (their pins too).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # The analyzers (Directory.Packages.props) and the format tool (.config/dotnet-tools.json) move together.
    groups:
      stylebro:
        patterns: ["StyleBro.*"]
