version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows and our composite actions (their pins too).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    # One PR a week instead of one per action (each is a full CI run): minor and patch updates together, which
    # dependabot-auto-merge.yml merges once green, and majors together, which wait for a look.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # The analyzers (Directory.Packages.props) and the format tool (.config/dotnet-tools.json) move together.
    groups:
      stylebro:
        patterns: ["StyleBro.*"]
