name: BtbN's FFmpeg
description: >-
  BtbN's static FFmpeg build (GitHub releases), downloaded to a file with retries and checked before it's unpacked,
  cached per day; when the download fails, the last cached copy is used with a warning. CI's network failures
  (connection resets, truncated archives) otherwise failed whole runs.
inputs:
  version:
    description: FFmpeg series, e.g. 8.1 or 9.0
    default: '8.1'
  platform:
    description: BtbN's platform name (linux64, linuxarm64)
    default: linux64
  add-to-path:
    description: Put its bin folder on PATH
    default: 'true'
outputs:
  bin:
    description: The folder with ffmpeg and ffprobe
    value: ${{ steps.get.outputs.bin }}
runs:
  using: composite
  steps:
    - id: day
      shell: bash
      run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - id: cache
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/btbn-${{ inputs.version }}-${{ inputs.platform }}
        key: btbn-${{ inputs.version }}-${{ inputs.platform }}-${{ steps.day.outputs.day }}
        restore-keys: btbn-${{ inputs.version }}-${{ inputs.platform }}-

    - id: get
      shell: bash
      env:
        V: ${{ inputs.version }}
        P: ${{ inputs.platform }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
        ADD: ${{ inputs.add-to-path }}
      run: |
        dir="$RUNNER_TEMP/btbn-$V-$P"
        name="ffmpeg-n$V-latest-$P-gpl-$V"
        if [ "$HIT" != true ]; then
          archive="$RUNNER_TEMP/$name.tar.xz"
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -o "$archive" \
               "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$name.tar.xz" && xz -t "$archive"; then
            rm -rf "$dir" && mkdir -p "$dir" && tar -xJf "$archive" -C "$dir" && rm -f "$archive"
          elif [ -x "$dir/$name/bin/ffmpeg" ]; then
            echo "::warning::BtbN's FFmpeg $V ($P) didn't download; using the copy cached on an earlier day"
          else
            echo "::error::BtbN's FFmpeg $V ($P) didn't download, and no earlier copy is cached"
            exit 1
          fi
        fi
        "$dir/$name/bin/ffmpeg" -hide_banner -version | head -1
        echo "bin=$dir/$name/bin" >> "$GITHUB_OUTPUT"
        if [ "$ADD" = true ]; then echo "$dir/$name/bin" >> "$GITHUB_PATH"; fi
