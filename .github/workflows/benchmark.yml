name: Benchmark

# Wall time, frames per second and peak memory (process tree) of scenedetect and shotdetect on the real-world
# films (tools/bench.py, best of 3), in the run summary. On demand and weekly: a hosted runner is quieter than a
# desktop, but numbers still vary by a few percent between runs.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 0'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FFMPEG: '9.0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG.tar.xz" | tar -xJ
          echo "$PWD/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG/bin" >> "$GITHUB_PATH"

      - name: Install scenedetect
        run: pip install scenedetect==0.7.1 opencv-python-headless==5.0.0.93 psutil

      - name: Build
        run: dotnet build src/ShotDetector.Cli -c Release

      - name: Cache the videos
        uses: actions/cache@v5
        with:
          path: samples/realworld
          key: realworld-films-${{ hashFiles('tools/realworld.py') }}

      - name: Benchmark
        run: |
          films="bbb_640x360_h264.mp4 elephants_dream_426x240_h264.mp4 tears_of_steel_1280x534_h264.mov"
          python tools/realworld.py $films --download
          echo "Runner: $(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB" >> "$GITHUB_STEP_SUMMARY"
          for d in content adaptive; do
            python tools/bench.py $(for f in $films; do echo samples/realworld/$f; done) --detector $d --runs 3 --report bench.md
            { echo "### detect-$d"; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"
          done
