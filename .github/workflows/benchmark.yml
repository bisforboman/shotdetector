name: Benchmark

# Wall time, frames per second, CPU time and peak memory (whole process tree) of scenedetect and shotdetect, in its
# default mode (in-process, with our bundled FFmpeg libraries) and with the ffmpeg executable, on the real-world
# films (tools/bench.py, best of 3), in the run summary; README "Performance" comes from it. On demand and weekly: a hosted runner is quieter than a
# desktop, but numbers still vary by a few percent between runs.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 0'

jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      rids: '["linux-x64"]'

  benchmark:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FFMPEG: '9.0'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG.tar.xz" | tar -xJ
          echo "$PWD/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG/bin" >> "$GITHUB_PATH"

      - name: Install scenedetect
        run: pip install scenedetect==0.7.1 opencv-python-headless==5.0.0.93 psutil

      # Our FFmpeg libraries in native/: the CLI bundles them, so its default decodes in-process, as users get it.
      - uses: actions/download-artifact@v7
        with:
          name: native-linux-x64
          path: native/linux-x64

      - name: Build
        run: dotnet build src/ShotDetector.Cli -c Release

      - name: Cache the videos
        uses: actions/cache@v5
        with:
          path: samples/realworld
          key: realworld-films-${{ hashFiles('tools/realworld.py') }}

      - name: Benchmark
        run: |
          films="sintel_trailer_1920x1080_h264.mp4 tears_of_steel_1280x534_h264.mov bbb_640x360_h264.mp4 elephants_dream_426x240_h264.mp4"
          python tools/realworld.py $films --download
          echo "Runner: $(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB" >> "$GITHUB_STEP_SUMMARY"
          for d in content adaptive; do
            python tools/bench.py $(for f in $films; do echo samples/realworld/$f; done) --detector $d --runs 3 --report bench.md
            { echo "### detect-$d, all $(nproc) CPUs"; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"
          done
          # A small container's view: both tools and their children pinned to 2 CPUs (issue #12).
          taskset -c 0,1 python tools/bench.py $(for f in $films; do echo samples/realworld/$f; done) --detector content --runs 3 --report bench2.md
          { echo "### detect-content, 2 CPUs"; cat bench2.md; } >> "$GITHUB_STEP_SUMMARY"
