name: Benchmark

# Wall time, frames per second, CPU time and peak memory (whole process tree) of scenedetect and shotdetect, in its
# default mode (in-process, with our bundled FFmpeg libraries) and with the ffmpeg executable, on the real-world
# films (tools/bench.py, best of 3), in the run summary, plus both with --stats (the content detector then computes
# edges for every frame, so EdgeDetector's speed is tracked); README "Performance" comes from it. Then
# benchmarks/micro, the resize and edge detector alone. On demand and weekly: a hosted runner is quieter than a
# desktop, but numbers still vary by a few percent between runs. Each runner's numbers also go into one JSON file
# (tools/bench_record.py), an artifact, which runs on main commit to the bench-data branch (runs/, its README:
# benchmarks/bench-data.md), so their history can be charted.
on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 0'

# The token only reads the repository; the publish job alone writes (to the bench-data branch).
permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      rids: '["linux-x64","linux-arm64"]'

  # x64 and ARM (Neoverse) runners, each with our FFmpeg build for its platform.
  benchmark:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-26.04, btbn: linux64 }
          - { rid: linux-arm64, os: ubuntu-26.04-arm, btbn: linuxarm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      FFMPEG: '9.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          version: ${{ env.FFMPEG }}
          platform: ${{ matrix.btbn }}

      - name: Install scenedetect
        run: pip install scenedetect==0.7.2 opencv-python-headless==5.0.0.93 psutil

      # Our FFmpeg libraries in native/: the CLI bundles them, so its default decodes in-process, as users get it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - name: Build
        run: dotnet build src/ShotDetector.Cli -c Release

      - name: Cache the videos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: samples/realworld
          key: realworld-films-${{ hashFiles('tools/realworld.py') }}

      - name: Benchmark
        run: |
          films="sintel_trailer_1920x1080_h264.mp4 tears_of_steel_1280x534_h264.mov bbb_640x360_h264.mp4 elephants_dream_426x240_h264.mp4"
          python tools/realworld.py $films --download
          echo "### ${{ matrix.rid }}: $(nproc) CPUs ($(lscpu | sed -n 's/^Model name: *//p' | head -1)), $(free -g | awk '/Mem:/ {print $2}') GB" >> "$GITHUB_STEP_SUMMARY"
          for d in content adaptive; do
            python tools/bench.py $(for f in $films; do echo samples/realworld/$f; done) --detector $d --runs 3 --report bench.md --json bench-$d.json
            { echo "### detect-$d, all $(nproc) CPUs"; cat bench.md; } >> "$GITHUB_STEP_SUMMARY"
          done
          # Per-frame stats: scenedetect -s against shotdetect --stats in-process; edges on every frame.
          python tools/bench.py $(for f in $films; do echo samples/realworld/$f; done) --detector content --stats --runs 3 --report bench-stats.md --json bench-content-stats.json
          { echo "### detect-content --stats, all $(nproc) CPUs"; cat bench-stats.md; } >> "$GITHUB_STEP_SUMMARY"
          # A small container's view: both tools and their children pinned to 2 CPUs (issue #12). bench.py leaves out
          # --parallel and --sequential there: chunks need 4 CPUs, so they'd repeat the default's row.
          taskset -c 0,1 python tools/bench.py $(for f in $films; do echo samples/realworld/$f; done) --detector content --runs 3 --report bench2.md --json bench-content-2cpu.json
          { echo "### detect-content, 2 CPUs (sequential: chunks need 4)"; cat bench2.md; } >> "$GITHUB_STEP_SUMMARY"

      # The per-frame pixel work alone (benchmarks/micro: the resize and the edge detector, best of 15 rounds, real
      # frames from the same films and the synthetic set), so a regression there shows week to week.
      - name: Microbenchmarks
        run: |
          set -o pipefail
          dotnet build -c Release benchmarks/micro -v q
          dotnet run -c Release --no-build --project benchmarks/micro -- --films samples/realworld | tee micro.txt
          { echo "### benchmarks/micro, us per frame"; echo '```text'; cat micro.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Everything above as one JSON file (schema: benchmarks/bench-data.md), also when a step failed after some ran.
      - name: Record
        if: ${{ !cancelled() }}
        run: |
          variants=""
          for v in content adaptive content-stats content-2cpu; do
            [ -f bench-$v.json ] && variants="$variants $v=bench-$v.json"
          done
          [ -n "$variants" ] || [ -f micro.txt ] || { echo "nothing measured, nothing recorded"; exit 0; }
          mkdir -p bench-data
          python tools/bench_record.py --rid ${{ matrix.rid }} --micro micro.txt \
            --out "bench-data/$(date -u +%F)-$GITHUB_RUN_ID-${{ matrix.rid }}.json" $variants

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: bench-data-${{ matrix.rid }}
          path: bench-data/*.json
          if-no-files-found: ignore

  # Runs on main (weekly, or dispatched there) add their files to the bench-data branch under runs/, created as an
  # orphan branch the first time; other branches' runs keep only the artifact. Plain git with this job's token, never
  # a force-push: on a rejected push it starts again from the branch's new tip. (Pushes made with GITHUB_TOKEN start
  # no workflows.)
  publish:
    needs: benchmark
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true  # neither runner got as far as recording
        with:
          pattern: bench-data-*
          merge-multiple: true
          path: ${{ runner.temp }}/runs

      - name: Commit to bench-data
        env:
          RUNS: ${{ runner.temp }}/runs
        run: |
          shopt -s nullglob
          files=("$RUNS"/*.json)
          if [ ${#files[@]} -eq 0 ]; then echo "no runner recorded data"; exit 0; fi
          cp benchmarks/bench-data.md "$RUNNER_TEMP/README.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth=1 origin bench-data 2>/dev/null; then
              git checkout -q -f -B bench-data FETCH_HEAD
            else
              git checkout -q --detach && { git branch -q -D bench-data 2>/dev/null || true; }
              git checkout -q --orphan bench-data
              git rm -rq --cached . && git clean -fdxq
            fi
            mkdir -p runs
            cp "${files[@]}" runs/
            cp "$RUNNER_TEMP/README.md" README.md
            (cd runs && ls *.json | grep -v '^index\.json$' | sort | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin], indent=1))' > index.json)
            git add README.md runs
            git diff --cached --quiet || git commit -qm "Benchmark run $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            if git push -q origin HEAD:refs/heads/bench-data; then
              git log -1 --stat --format='%H %s'
              exit 0
            fi
            echo "push rejected (attempt $attempt), starting again from the branch's tip"
            sleep $((attempt * 5))
          done
          exit 1
