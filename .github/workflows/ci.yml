name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready

# A new push to a pull request supersedes its running checks; pushes to main all run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only pull requests (docs/ and *.md): the jobs below still run, so their required checks report, but skip
  # their steps. Decided here, on a runner with git, from the PR's merge commit against its base.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then echo docs_only=true >> "$GITHUB_OUTPUT"; fi

  # Our FFmpeg build for linux-x64 (native.yml, cached by the build script's hash): the in-process tests and the
  # AOT binary use it.
  native:
    needs: changes
    uses: ./.github/workflows/native.yml
    with:
      rids: '["linux-x64"]'

  build:
    needs: [changes, native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg   # the video tests make clips with it, and the library runs it
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 10   # package mirrors sometimes hang
        run: |
          # BtbN's static FFmpeg 8.1, from GitHub's servers: the apt mirrors hung twice (2026-10-07).
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      # In-process decoding with our FFmpeg build (ShotDetector.Native's): InProcessTests compare it with FFmpeg
      # 8.1's executables, put beside it (BtbN's static build, so they don't load these libraries).
      - uses: actions/download-artifact@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: native-linux-x64
          path: native/linux-x64

      - name: FFmpeg 8.1 executables beside our libraries
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cp "$RUNNER_TEMP"/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin/ffmpeg "$RUNNER_TEMP"/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin/ffprobe native/linux-x64/
          echo "SHOTDETECTOR_FFMPEG_LIBS=$PWD/native/linux-x64" >> "$GITHUB_ENV"

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet test ShotDetector.slnx

      - name: Pack
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          dotnet pack src/ShotDetector --output artifacts
          dotnet pack src/ShotDetector.FastYuv --output artifacts
          dotnet pack src/ShotDetector.Cli --output artifacts

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # The shotdetect CLI as a Native AOT binary for each platform the release ships (see release.yml):
  # it must build, start, and (on Linux, where ffmpeg is easy to install) detect the cuts in a clip.
  aot:
    needs: [changes, native]
    if: github.event_name == 'pull_request'   # main: build and tests only
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-musl-x64, os: ubuntu-latest, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Native toolchain (Alpine)
        if: needs.changes.outputs.docs_only != 'true' && (matrix.rid == 'linux-musl-x64')
        shell: sh   # bash isn't installed yet
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache clang build-base zlib-dev bash

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.docs_only != 'true' && (matrix.rid != 'linux-musl-x64')
        with:
          dotnet-version: 10.0.x

      # linux-x64 bundles our FFmpeg build next to the binary, as the release does: then it decodes in-process.
      - uses: actions/download-artifact@v7
        if: needs.changes.outputs.docs_only != 'true' && (matrix.rid == 'linux-x64')
        with:
          name: native-linux-x64
          path: native/linux-x64

      - name: Publish
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet publish src/ShotDetector.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o out

      - name: Starts
        if: needs.changes.outputs.docs_only != 'true'
        run: ./out/shotdetect --help | head -3

      - name: Detects cuts
        if: needs.changes.outputs.docs_only != 'true' && (startsWith(matrix.rid, 'linux'))
        run: |
          if [ -f /etc/alpine-release ]; then apk add --no-cache ffmpeg; else curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C "$RUNNER_TEMP" && export PATH="$RUNNER_TEMP/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin:$PATH"; fi
          ffmpeg -v error -f lavfi -i testsrc2=s=320x240:r=25:d=2 -f lavfi -i smptebars=s=320x240:r=25:d=2 \
            -filter_complex "[0][1]concat=n=2:v=1:a=0,format=yuv420p" -r 25 -c:v mpeg4 clip.mp4
          ./out/shotdetect -i clip.mp4 -d content --csv shots.csv 2> summary.txt
          cat summary.txt
          test "$(tail -n +3 shots.csv | wc -l)" -eq 2   # after the "Timecode List:" row and the header
          # With the bundled libraries, the AOT binary decodes in-process (FFmpeg.AutoGen under Native AOT).
          if [ "${{ matrix.rid }}" = linux-x64 ]; then grep -q "decoded in-process" summary.txt; fi

  # Alpine (musl), with Alpine's own ffmpeg. scenedetect can't run here (no musl OpenCV wheels), but
  # the video tests check real detection, cancellation, and that Alpine's ffmpeg converts colours
  # exactly like the FastYuv converter (which the parity job ties to scenedetect).
  alpine:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache ffmpeg && ffmpeg -hide_banner -version | head -1

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet test ShotDetector.slnx

  # ShotDetector and scenedetect run on the same clips; cuts, scene list CSVs and per-frame stats must
  # be identical, for the core path and the FastYuv path, for each supported scenedetect release (in
  # the matching compatibility mode). The reference is scenedetect on Linux, whose OpenCV wheel
  # bundles FFmpeg 8 and so follows colour tags (the Windows wheel's FFmpeg 7.1 doesn't).
  parity:
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        path: [core, fast-yuv]
        scenedetect: ['0.7.1']   # the release reproduced; a previous one joins here when the default moves on
    env:
      FFMPEG: '9.0'   # the latest stable FFmpeg; BtbN's static build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG.tar.xz" | tar -xJ
          echo "$PWD/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG/bin" >> "$GITHUB_PATH"

      - name: ffmpeg version
        if: needs.changes.outputs.docs_only != 'true'
        run: ffmpeg -hide_banner -version | head -1

      - name: Install scenedetect
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install scenedetect==${{ matrix.scenedetect }} opencv-python-headless==5.0.0.93

      - name: Make sample clips
        if: needs.changes.outputs.docs_only != 'true'
        shell: pwsh
        run: ./tools/make-samples.ps1

      - name: Compare with scenedetect
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          status=0
          python tools/compare.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg \
            --detector all --stats --report parity.md --compat ${{ matrix.scenedetect }} \
            ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || status=$?
          { echo "### scenedetect ${{ matrix.scenedetect }}, ${{ matrix.path }} path"; cat parity.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Time range, frame skip and crop must give scenedetect's results too (constant frame rate clips).
      - name: Compare with scenedetect's time, --frame-skip and --crop options
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.1')
        run: |
          status=0
          python tools/compare.py samples/sintel_trailer-480p.mp4 samples/bbb_trailer_400p.ogg samples/sintel_rotated.mp4             --detector both --stats --report options.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }}             --scenedetect-args "--crop 100 50 700 400 time -s 2s -e 00:00:20.000" --ours-args "--crop 100 50 700 400 -s 2s -e 00:00:20.000" || status=$?
          python tools/compare.py samples/sintel_trailer-480p.mp4 samples/synthetic.mp4             --detector both --report skip.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }}             --scenedetect-args "-fs 2 time -s 241 -d 300" --ours-args "--frame-skip 2 -s 241 --duration 300" || status=$?
          { echo "### time/crop and frame-skip options, ${{ matrix.path }} path"; cat options.md skip.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # save-edl, save-fcp (fcpx and fcp7), save-otio and save-qp must be byte-identical (the CLI was built
      # by the compare steps above). Once: the exports don't depend on the frame pipeline.
      - name: Compare timeline exports with scenedetect's
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.1' && matrix.path == 'core')
        run: python tools/compare-timeline.py

      # Several detectors, per-detector options, drop/merge, suppress, -d downscale: CSVs and stats identical.
      - name: Compare detection options with scenedetect
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.1' && matrix.path == 'core')
        run: python tools/compare-options.py

      # load-scenes: shots read back from a scene list, then re-exported; byte-identical.
      - name: Compare load-scenes with scenedetect
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.1' && matrix.path == 'core')
        run: python tools/compare-load-scenes.py

      # detect-hash is informational: on flat frames (fades to black) the perceptual hash is DCT
      # rounding noise, in scenedetect itself as much as here, so a few frames and the odd cut inside
      # a fade differ. Everything else should match; eyeball the table if it changes.
      - name: Compare detect-hash with scenedetect (informational)
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.1')
        run: |
          python tools/compare.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg             --detector hash --stats --report hash.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || true
          { echo "### detect-hash (informational), ${{ matrix.path }} path"; cat hash.md; } >> "$GITHUB_STEP_SUMMARY"

      # 10-bit video: OpenCV's bundled FFmpeg converts it to 8-bit BGR with +-1 differences in red and
      # green on some pixels that no ffmpeg CLI option reproduces, so per-frame stats differ a little.
      # Cuts should still match; eyeball the table if they don't.
      - name: Compare 10-bit video with scenedetect (informational)
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.1')
        run: |
          python tools/compare.py samples/informational/*.mp4 --detector all --stats --report tenbit.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || true
          { echo "### 10-bit (informational), ${{ matrix.path }} path"; cat tenbit.md; } >> "$GITHUB_STEP_SUMMARY"
