name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg   # the video tests make clips with it, and the library runs it
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        run: dotnet test ShotDetector.slnx

      - name: Pack
        run: |
          dotnet pack src/ShotDetector --output artifacts
          dotnet pack src/ShotDetector.FastYuv --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # Alpine (musl), with Alpine's own ffmpeg. scenedetect can't run here (no musl OpenCV wheels), but
  # the video tests check real detection, cancellation, and that Alpine's ffmpeg converts colours
  # exactly like the FastYuv converter (which the parity job ties to scenedetect).
  alpine:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: apk add --no-cache ffmpeg && ffmpeg -hide_banner -version | head -1

      - name: Test
        run: dotnet test ShotDetector.slnx

  # ShotDetector and scenedetect run on the same clips; cuts, scene list CSVs and per-frame stats must
  # be identical, for the core path and the FastYuv path, for each supported scenedetect release (in
  # the matching compatibility mode). The reference is scenedetect on Linux, whose OpenCV wheel
  # bundles FFmpeg 8 and so follows colour tags (the Windows wheel's FFmpeg 7.1 doesn't).
  parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [core, fast-yuv]
        scenedetect: ['0.7.1', '0.6.4']
    env:
      FFMPEG: '9.0'   # the latest stable FFmpeg; BtbN's static build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG.tar.xz" | tar -xJ
          echo "$PWD/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG/bin" >> "$GITHUB_PATH"

      - name: ffmpeg version
        run: ffmpeg -hide_banner -version | head -1

      - name: Install scenedetect
        run: pip install scenedetect==${{ matrix.scenedetect }} opencv-python-headless==5.0.0.93

      - name: Make sample clips
        shell: pwsh
        run: ./tools/make-samples.ps1

      # scenedetect 0.6.4's ThresholdDetector is nondeterministic on Linux (its decode thread can hand a
      # frame over with the wrong frame number; repeated runs differ), so for 0.6.4 only the content
      # and adaptive detectors are compared. On Windows all three matched 0.6.4 exactly.
      - name: Compare with scenedetect
        run: |
          status=0
          python tools/compare.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi \
            --detector ${{ matrix.scenedetect == '0.6.4' && 'both' || 'all' }} --stats --report parity.md --compat ${{ matrix.scenedetect }} \
            ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || status=$?
          { echo "### scenedetect ${{ matrix.scenedetect }}, ${{ matrix.path }} path"; cat parity.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
