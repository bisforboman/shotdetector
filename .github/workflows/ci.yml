name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ShotDetector.slnx

      - name: Pack
        run: |
          dotnet pack src/ShotDetector --output artifacts
          dotnet pack src/ShotDetector.FastYuv --output artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # ShotDetector and scenedetect run on the same clips; cuts, scene list CSVs and per-frame stats must
  # be identical, for the core path and the FastYuv path. The reference is scenedetect on Linux, whose
  # OpenCV wheel bundles FFmpeg 8 and so follows colour tags (the Windows wheel's FFmpeg 7.1 doesn't).
  parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [core, fast-yuv]
    env:
      FFMPEG: '9.0'   # the latest stable FFmpeg; BtbN's static build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG.tar.xz" | tar -xJ
          echo "$PWD/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG/bin" >> "$GITHUB_PATH"

      - name: ffmpeg version
        run: ffmpeg -hide_banner -version | head -1

      - name: Install scenedetect
        run: pip install scenedetect==0.7.1 opencv-python-headless==5.0.0.93

      - name: Make sample clips
        shell: pwsh
        run: ./tools/make-samples.ps1

      - name: Compare with scenedetect
        run: |
          status=0
          python tools/compare.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi \
            --detector all --stats --report parity.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || status=$?
          { echo "### ${{ matrix.path }} path"; cat parity.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
