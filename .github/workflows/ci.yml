name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready

# A new push to a pull request supersedes its running checks; pushes to main all run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # Docs-only pull requests (docs/ and *.md): the jobs below still run, so their required checks report, but skip
  # their steps. Decided here, on a runner with git, from the PR's merge commit against its base.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      light: ${{ steps.diff.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      # FrameReader's assemblies are built when only FrameReader source changed (tools/ci-changes.sh).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: github.event_name == 'pull_request'
        with:
          dotnet-version: 10.0.x
      - id: diff
        if: github.event_name == 'pull_request'
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"

  # Line endings are per file here (no .gitattributes; most CRLF, some LF). A file whose lines changed only in their
  # ending was rewritten by an editor or Git Bash's `sed -i`, and blame would show every line as changed (README.md
  # in #165, restored in #167). A few lines (a mixed file's edited block) pass; more fail the pull request. A
  # conversion on purpose: label the pull request `line-endings`.
  line-endings:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'line-endings')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: No file's line endings rewritten
        run: |
          bad=0
          while IFS=$'\t' read -r added deleted file; do
            [ "$added" = "-" ] && continue   # binary
            ignoring=$(git diff --numstat --ignore-cr-at-eol HEAD^1 HEAD -- "$file" | cut -f1)
            only=$((added - ${ignoring:-0}))
            echo "$file: $added lines added, $only only in their line ending"
            if [ "$only" -gt 20 ]; then
              echo "::error file=$file::$only lines changed only their line ending (CRLF/LF): keep the file's own"
              bad=1
            fi
          done < <(git diff --numstat HEAD^1 HEAD)
          exit $bad

  # Our FFmpeg build for linux-x64 (native.yml, cached by the build script's hash): the in-process tests and the
  # AOT binary use it.
  native:
    needs: changes
    uses: ./.github/workflows/native.yml
    with:
      rids: '["linux-x64"]'

  build:
    needs: [changes, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      # BtbN's static FFmpeg 8.1 (the apt mirrors hung twice, 2026-10-07): the video tests make clips with it, and the
      # library runs it.
      - name: Install ffmpeg
        id: ffmpeg
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg

      # In-process decoding with our FFmpeg build (FrameReader.Native's): InProcessTests compare it with FFmpeg
      # 8.1's executables, put beside it (BtbN's static build, so they don't load these libraries).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: native-linux-x64
          path: native/linux-x64

      # The package release.yml packs from these: the libraries under runtimes/, configure.txt and the SBOM at the root.
      - name: Pack FrameReader.Native
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          dotnet pack src/FrameReader.Native -p:Rid=linux-x64 --output "$RUNNER_TEMP/native-pack"
          unzip -l "$RUNNER_TEMP"/native-pack/*.nupkg | tee "$RUNNER_TEMP/native-pack.txt"
          grep -q " sbom.spdx.json$" "$RUNNER_TEMP/native-pack.txt" && grep -q " configure.txt$" "$RUNNER_TEMP/native-pack.txt" &&
            grep -q " runtimes/linux-x64/native/libavcodec.so.62$" "$RUNNER_TEMP/native-pack.txt"

      - name: FFmpeg 8.1 executables beside our libraries
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cp "${{ steps.ffmpeg.outputs.bin }}/ffmpeg" "${{ steps.ffmpeg.outputs.bin }}/ffprobe" native/linux-x64/
          echo "SHOTDETECTOR_FFMPEG_LIBS=$PWD/native/linux-x64" >> "$GITHUB_ENV"

      # BBC's audiowaveform, the reference for FrameReader's WaveformData (its test is skipped without it). Ubuntu
      # doesn't package it; its maintainer's PPA, as its README says, has a build for each Ubuntu release.
      - name: Install audiowaveform
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 5   # package mirrors sometimes hang
        run: |
          if sudo add-apt-repository -y ppa:chris-needham/ppa > /dev/null && sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends audiowaveform > /dev/null; then
            audiowaveform --version
            echo "AUDIOWAVEFORM=$(command -v audiowaveform)" >> "$GITHUB_ENV"
          else
            echo "::warning::audiowaveform didn't install: WaveformData's comparison with it is skipped"
          fi

      # Widevine's pssh box from Shaka Packager's pssh-box.py (what issue #171's service used), for
      # RemuxTests.EncryptedAsFfmpegWithWidevineSignalling to compare ours with, byte for byte.
      - name: pssh-box.py's Widevine pssh
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o pssh-box.tar.gz https://github.com/shaka-project/shaka-packager/releases/download/v3.9.3/pssh-box.py.tar.gz
          echo "277f88fc3a1bcf295f7dbe9c98cc88fbf98308c9adce48256fa74af872326932  pssh-box.tar.gz" | sha256sum -c
          mkdir pssh-box && tar xzf pssh-box.tar.gz -C pssh-box
          script=$(find pssh-box -name pssh-box.py | head -1)
          pssh=$(python3 "$script" --widevine-system-id --key-id a1b2c3d4e5f60718293a4b5c6d7e8f90 --base64)
          echo "pssh-box.py: $pssh"
          echo "SHOTDETECTOR_WIDEVINE_PSSH=$pssh" >> "$GITHUB_ENV"
          # A DRM provider's own WidevinePsshData (issue #185): key ID, provider "conax", content_id "content-0001".
          from_data=$(python3 "$script" --widevine-system-id --pssh-data EhChssPU5fYHGCk6S1xtfo+QGgVjb25heCIMY29udGVudC0wMDAx --base64)
          echo "pssh-box.py --pssh-data: $from_data"
          echo "SHOTDETECTOR_WIDEVINE_PSSH_FROM_DATA=$from_data" >> "$GITHUB_ENV"

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet test ShotDetector.slnx

      # The resize's and edge detector's outputs on the synthetic set, the same hash on x64 and ARM (benchmarks/micro).
      - name: Microbenchmark hashes as recorded
        if: needs.changes.outputs.docs_only != 'true'
        run: benchmarks/micro/check-hash.sh

      # The other SIMD paths on x64: AVX2 off takes the Vector128 ones (ARM's: the edge suppression, the content score,
      # the resize's vertical pass) and the scalar HSV; intrinsics off, every scalar loop. Against cv2 and the same hash.
      - name: Pixel tests and hashes without AVX2, and without SIMD
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          for env in DOTNET_EnableAVX2=0 DOTNET_EnableHWIntrinsic=0; do
            echo "== $env"
            env "$env" dotnet test tests/ShotDetector.Tests --no-build \
              --filter "FullyQualifiedName~PixelTests|FullyQualifiedName~HsvTests|FullyQualifiedName~ContentScorerTests"
            env "$env" benchmarks/micro/check-hash.sh
          done

      # The CLI's --waveform with audiowaveform's options gives audiowaveform's .dat, byte for byte (PCM input).
      - name: CLI --waveform is audiowaveform's
        if: needs.changes.outputs.docs_only != 'true' && env.AUDIOWAVEFORM != ''
        run: |
          ffmpeg -v error -f lavfi -i "aevalsrc=0.5*sin(440*2*PI*t)|0.3*sin(990*2*PI*t):s=44100:d=5" -c:a pcm_s16le tone.wav
          dotnet run --project src/ShotDetector.Cli -- -i tone.wav --ffmpeg-dir "$SHOTDETECTOR_FFMPEG_LIBS" \
            --waveform ours.dat --waveform-zoom 512 --waveform-bits 8 --waveform-split-channels
          "$AUDIOWAVEFORM" -q -i tone.wav -o theirs.dat -z 512 -b 8 --split-channels
          cmp ours.dat theirs.dat

      # #81's job from the command line: line-up tone notched out for its first 4 s and written out; the same samples as
      # ffmpeg -af ... gives (as WAV: an MP3's bytes depend on how LAME was built, and ours isn't BtbN's), and
      # silencedetect's results as ffmpeg finds them.
      - name: CLI --audio-filter and --audio-out are ffmpeg's
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          ffmpeg -v error -f lavfi -i "aevalsrc='if(lt(t,4),0.13*sin(1000*2*PI*t),if(lt(t,6),0,0.3*sin(440*2*PI*t)))':s=48000:d=10" -ac 2 -c:a pcm_s16le job.wav
          G="equalizer=f=1000:t=q:w=8:g=-40:enable='between(t,0,4)'"
          dotnet run --project src/ShotDetector.Cli -- -i job.wav --ffmpeg-dir "$SHOTDETECTOR_FFMPEG_LIBS" --audio-filter "$G" --audio-out ours.wav
          ffmpeg -v error -i job.wav -af "$G" -c:a pcm_s16le theirs.wav
          test "$(ffmpeg -v error -i ours.wav -f f32le - | md5sum)" = "$(ffmpeg -v error -i theirs.wav -f f32le - | md5sum)"
          dotnet run --project src/ShotDetector.Cli -- -i job.wav --ffmpeg-dir "$SHOTDETECTOR_FFMPEG_LIBS" --audio-filter "silencedetect=n=-50dB:d=1" | tee silence.txt
          grep -q "lavfi.silence_start=4$" silence.txt && grep -q "lavfi.silence_end=6.000021 " silence.txt

      # RTSP input (a live source, so not frame for frame against a file: the reader joins once the probe has started
      # the stream): mediamtx serves a five-shot clip (2 s shots at 25 fps) on demand, published over TCP, and the cuts found
      # over rtsp:// must be exactly 50 frames apart. Then a live source that never ends (the clip looped) with --duration 8s:
      # 8 s of frames. Each run gets a fresh server: a reader joining an on-demand stream an earlier one used up hangs.
      - name: RTSP input
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 10
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o mtx.tgz https://github.com/bluenviron/mediamtx/releases/download/v1.21.2/mediamtx_v1.21.2_linux_amd64.tar.gz
          echo "121be6e00397e473a95d83c75f4fcd3819a6af3b0e1a50889cba43ab4fab6a27  mtx.tgz" | sha256sum -c
          tar xzf mtx.tgz mediamtx
          ffmpeg -v error -f lavfi -i testsrc2=s=320x240:r=25:d=2 -f lavfi -i smptebars=s=320x240:r=25:d=2 -f lavfi -i rgbtestsrc=s=320x240:r=25:d=2 \
            -f lavfi -i testsrc=s=320x240:r=25:d=2 -f lavfi -i smptehdbars=s=320x240:r=25:d=2 \
            -filter_complex "[0][1][2][3][4]concat=n=5:v=1:a=0,format=yuv420p" -c:v libx264 -g 25 shots.mp4
          printf '%s\n' 'logLevel: warn' 'rtmp: no' 'hls: no' 'webrtc: no' 'srt: no' 'paths:' '  shots:' \
            "    runOnDemand: ffmpeg -re -i $PWD/shots.mp4 -c copy -f rtsp -rtsp_transport tcp rtsp://localhost:\$RTSP_PORT/\$MTX_PATH" > mtx.yml
          ./mediamtx mtx.yml & server=$!
          sleep 2
          dotnet run --project src/ShotDetector.Cli -- -i rtsp://127.0.0.1:8554/shots -d content --ffmpeg-dir "$SHOTDETECTOR_FFMPEG_LIBS" --csv rtsp.csv
          kill $server
          # Cut frames (the CSV's Start Frame column after the header rows): every gap between cuts is one shot, 50 frames.
          python3 -c "
          import csv
          rows = list(csv.reader(open('rtsp.csv')))[2:]
          starts = [int(r[1]) for r in rows[1:]]
          gaps = [b - a for a, b in zip(starts, starts[1:])]
          print('cuts at', starts, 'gaps', gaps)
          assert len(gaps) >= 2 and set(gaps) == {50}, gaps
          "
          kill -9 $server 2>/dev/null || true; pkill -9 -f shots.mp4 || true; sleep 1
          sed -i 's/ffmpeg -re -i/ffmpeg -re -stream_loop -1 -i/' mtx.yml
          ./mediamtx mtx.yml & server=$!
          sleep 2
          timeout 60 dotnet run --project src/ShotDetector.Cli -- -i rtsp://127.0.0.1:8554/shots -d content --ffmpeg-dir "$SHOTDETECTOR_FFMPEG_LIBS" \
            --duration 8s --stats live.csv
          kill -9 $server 2>/dev/null || true; pkill -9 -f shots.mp4 || true
          rows=$(($(wc -l < live.csv) - 1))   # 200 frames; the first has no score
          echo "looped source, --duration 8s: $rows stats rows"; test "$rows" -eq 199

      # FrameReader's VideoWriter (H.264) against ffmpeg -c:v libx264, byte for byte: x264's output depends on how it
      # was compiled, so libraries and executable from one build, BtbN's shared GPL one (ours has no executables).
      - name: FFmpeg 8.1 with x264, shared
        id: gpl
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared
          add-to-path: 'false'

      - name: Test VideoWriter with x264
        if: needs.changes.outputs.docs_only != 'true'
        env:
          SHOTDETECTOR_FFMPEG_LIBS: ${{ steps.gpl.outputs.bin }}
          SHOTDETECTOR_REQUIRE_X264: '1'
          SHOTDETECTOR_KEEP_DIFFERING: ${{ runner.temp }}/differing
          # x264's AVX-512 code and .NET's tiered JIT in one process differ from ffmpeg about 1 run in 250 on AVX-512
          # runners; either alone is exact (0 in 3,200 and 0 in 2,000 runs; FrameReader's README, backlog).
          DOTNET_TieredCompilation: '0'
        # Five times: run-to-run differences (uninitialised padding once) showed up in 1 run in 8.
        run: |
          mkdir -p "$RUNNER_TEMP/differing"
          dotnet build tests/FrameReader.Tests -v q > /dev/null
          for i in 1 2 3 4 5; do dotnet test tests/FrameReader.Tests --no-build --filter "FullyQualifiedName~VideoWriter"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: videowriter-differing
          path: ${{ runner.temp }}/differing/

      - name: Pack
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          dotnet pack src/ShotDetector --output artifacts
          dotnet pack src/ShotDetector.FastYuv --output artifacts
          dotnet pack src/FrameReader --output artifacts
          dotnet pack src/ShotDetector.Cli --output artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: nupkg
          path: artifacts/*.nupkg

  # The shotdetect CLI as a Native AOT binary for each platform the release ships (see release.yml):
  # it must build, start, and (on Linux, where ffmpeg is easy to install) detect the cuts in a clip.
  aot:
    needs: [changes, native]
    if: (github.event_name == 'pull_request') && needs.changes.outputs.light != 'true'   # main: build and tests only
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-26.04 }
          - { rid: linux-musl-x64, os: ubuntu-26.04, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Native toolchain (Alpine)
        if: needs.changes.outputs.docs_only != 'true' && (matrix.rid == 'linux-musl-x64')
        shell: sh   # bash isn't installed yet
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache clang build-base zlib-dev bash

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.docs_only != 'true' && (matrix.rid != 'linux-musl-x64')
        with:
          dotnet-version: 10.0.x

      # linux-x64 bundles our FFmpeg build next to the binary, as the release does: then it decodes in-process.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.docs_only != 'true' && (matrix.rid == 'linux-x64')
        with:
          name: native-linux-x64
          path: native/linux-x64

      # On Windows: dotnet format on Linux wants LF after '=>' before a comment even in CRLF files; Windows, where the
      # code is written and formatted, accepts the file's own line endings.
      - name: Code style (StyleBro)
        if: needs.changes.outputs.docs_only != 'true' && matrix.rid == 'win-x64'
        run: |
          dotnet tool restore > /dev/null
          dotnet tool run stylebro-migrate format ShotDetector.slnx --verify-no-changes

      - name: Publish
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet publish src/ShotDetector.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o out

      - name: Starts
        if: needs.changes.outputs.docs_only != 'true'
        run: ./out/shotdetect --help | head -3

      - name: Install ffmpeg (linux-x64)
        if: needs.changes.outputs.docs_only != 'true' && matrix.rid == 'linux-x64'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg

      - name: Detects cuts
        if: needs.changes.outputs.docs_only != 'true' && (startsWith(matrix.rid, 'linux'))
        run: |
          if [ -f /etc/alpine-release ]; then apk add --no-cache ffmpeg; fi
          ffmpeg -v error -f lavfi -i testsrc2=s=320x240:r=25:d=2 -f lavfi -i smptebars=s=320x240:r=25:d=2 \
            -filter_complex "[0][1]concat=n=2:v=1:a=0,format=yuv420p" -r 25 -c:v mpeg4 clip.mp4
          ./out/shotdetect -i clip.mp4 -d content --csv shots.csv 2> summary.txt
          cat summary.txt
          test "$(tail -n +3 shots.csv | wc -l)" -eq 2   # after the "Timecode List:" row and the header
          # --probe-json (System.Text.Json's writer, under Native AOT too).
          ./out/shotdetect -i clip.mp4 --probe-json > probe.json
          cat probe.json
          grep -q '"width": 320' probe.json && grep -q '"frameRate": "25/1"' probe.json
          # With the bundled libraries, the AOT binary decodes in-process (FFmpeg.AutoGen under Native AOT).
          if [ "${{ matrix.rid }}" = linux-x64 ]; then grep -q "decoded in-process" summary.txt; fi
          # https in-process (our OpenSSL), with the server's certificate checked against the system's.
          if [ "${{ matrix.rid }}" = linux-x64 ]; then
            ./out/shotdetect -i https://download.blender.org/demo/movies/ToS/tears_of_steel_720p.mov --decoder inprocess \
              -d content --duration 2s 2> https.txt || { cat https.txt; exit 1; }
            grep -q "48 frames" https.txt
          fi
          # Standard input, in-process with the libraries: FFmpeg calls back into .NET to read it (a custom AVIOContext).
          ffmpeg -v error -i clip.mp4 -c copy -f matroska clip.mkv
          ./out/shotdetect -i - -d content --csv piped.csv < clip.mkv 2> piped.txt
          cat piped.txt
          test "$(tail -n +3 piped.csv | wc -l)" -eq 2
          if [ "${{ matrix.rid }}" = linux-x64 ]; then grep -q "decoded in-process" piped.txt; fi

  # ARM (linux-arm64): the whole suite, so the NEON paths (HSV conversion, resize, frame differences) run against
  # their tests, the HSV one on all 2^24 colours, and the in-process tests use our linux-arm64 FFmpeg build.
  native-arm:
    needs: changes
    if: (github.event_name == 'pull_request') && needs.changes.outputs.light != 'true'
    uses: ./.github/workflows/native.yml
    with:
      rids: '["linux-arm64"]'

  arm:
    needs: [changes, native-arm]
    if: (github.event_name == 'pull_request') && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: native-linux-arm64
          path: native/linux-arm64

      - name: FFmpeg 8.1 (BtbN's static arm64 build)
        id: ffmpeg
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          platform: linuxarm64

      - name: Its executables beside our libraries
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cp "${{ steps.ffmpeg.outputs.bin }}/ffmpeg" "${{ steps.ffmpeg.outputs.bin }}/ffprobe" native/linux-arm64/
          echo "SHOTDETECTOR_FFMPEG_LIBS=$PWD/native/linux-arm64" >> "$GITHUB_ENV"

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet test ShotDetector.slnx

      # The resize's and edge detector's outputs on the synthetic set, the same hash on x64 and ARM (benchmarks/micro).
      - name: Microbenchmark hashes as recorded
        if: needs.changes.outputs.docs_only != 'true'
        run: benchmarks/micro/check-hash.sh

  # Alpine (musl), with Alpine's own ffmpeg. scenedetect can't run here (no musl OpenCV wheels), but
  # the video tests check real detection, cancellation, and that Alpine's ffmpeg converts colours
  # exactly like the FastYuv converter (which the parity job ties to scenedetect).
  alpine:
    needs: changes
    if: (github.event_name == 'pull_request') && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ffmpeg
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache ffmpeg && ffmpeg -hide_banner -version | head -1

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet test ShotDetector.slnx

  # The sample clips parity compares on (tools/make-samples.ps1, two minutes on a runner), made once and cached by
  # the script and the FFmpeg series; both sides read the same clips, so a newer daily build making slightly
  # different ones doesn't matter. On main too: a pull request reads only its own caches and main's, so this is
  # what every PR's first run finds.
  samples:
    needs: changes
    if: needs.changes.outputs.light != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      FFMPEG: '9.0'   # parity's
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Saves after the job when it missed.
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: samples
          key: samples-${{ hashFiles('tools/make-samples.ps1') }}-ffmpeg${{ env.FFMPEG }}
          lookup-only: true

      - name: Install ffmpeg ${{ env.FFMPEG }}
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          version: ${{ env.FFMPEG }}

      - name: Make sample clips
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/make-samples.ps1

  # ShotDetector and scenedetect run on the same clips; cuts, scene list CSVs and per-frame stats must
  # be identical, for the core path and the FastYuv path, for each supported scenedetect release (in
  # the matching compatibility mode). The reference is scenedetect on Linux, whose OpenCV wheel
  # bundles FFmpeg 8 and so follows colour tags (the Windows wheel's FFmpeg 7.1 doesn't). Each path in two jobs
  # (part): the main comparison, and the rest; one job ran them all in 8 minutes.
  parity:
    needs: [changes, native, samples]
    if: (github.event_name == 'pull_request') && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        path: [core, fast-yuv]
        scenedetect: ['0.7.2', '0.7.1']   # the default and the previous release, each in its --compat mode
        part: [compare, more]
        # The ffmpeg executable, and in-process with our FFmpeg build (what the CLI release and the Native packages
        # use by default).
        decoder: [process, inprocess]
        # The previous release: one job, the core path's main comparison through the executable (all its jobs matched
        # when 0.7.2 came in; this still catches a shared change that moves its results).
        exclude:
          - { scenedetect: '0.7.1', path: fast-yuv }
          - { scenedetect: '0.7.1', part: more }
          - { scenedetect: '0.7.1', decoder: inprocess }
    env:
      # The latest stable FFmpeg; BtbN's static build. No libraries here, so this is also Auto's fallback to the
      # executable where only FFmpeg 9 is installed (its libavcodec 63 doesn't load in-process).
      FFMPEG: '9.0'
      # Every shotdetect run compare.py makes, explicitly on this job's decoder (inprocess fails if the libraries
      # don't load, rather than falling back).
      SHOTDETECTOR_OURS_ARGS: --decoder ${{ matrix.decoder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          version: ${{ env.FFMPEG }}

      - name: ffmpeg version
        if: needs.changes.outputs.docs_only != 'true'
        run: ffmpeg -hide_banner -version | head -1

      # In-process: our FFmpeg build at native/linux-x64, which the CLI's build bundles (ShotDetector.Cli.csproj).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.docs_only != 'true' && matrix.decoder == 'inprocess'
        with:
          name: native-linux-x64
          path: native/linux-x64

      - name: Install scenedetect
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install scenedetect==${{ matrix.scenedetect }} opencv-python-headless==5.0.0.93

      # PixelTests' answers (Data/pixels.txt) are cv2's and scenedetect's: Linux's wheel must give the same file.
      - name: Pixel oracle unchanged on Linux
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.path == 'core' && matrix.part == 'compare')
        run: |
          python tools/pixel_oracle.py pixels.txt
          diff tests/ShotDetector.Tests/Data/pixels.txt pixels.txt

      # The clips, from the samples job's cache; made here only if that somehow missed.
      - id: samples
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples
          key: samples-${{ hashFiles('tools/make-samples.ps1') }}-ffmpeg${{ env.FFMPEG }}

      - name: Make sample clips
        if: needs.changes.outputs.docs_only != 'true' && steps.samples.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/make-samples.ps1

      - name: Compare with scenedetect
        if: needs.changes.outputs.docs_only != 'true' && matrix.part == 'compare'
        run: |
          status=0
          python tools/compare.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg \
            --detector all --stats --report parity.md --compat ${{ matrix.scenedetect }} \
            ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || status=$?
          { echo "### scenedetect ${{ matrix.scenedetect }}, ${{ matrix.path }} path, ${{ matrix.decoder }}"; cat parity.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Parallel detection (DetectionOptions.Mode): three chunks on every sample, byte for byte the sequential
      # result (all five detectors, stats, 0.7.2 and 0.7.1 mode); what a chunk can't reproduce (MPEG-PS) reads sequentially.
      - name: Parallel against sequential
        if: needs.changes.outputs.docs_only != 'true' && matrix.decoder == 'inprocess' && matrix.part == 'compare'
        run: |
          status=0
          python tools/compare-parallel.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg             --chunks 3 --report parallel.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || status=$?
          { echo "### Parallel against sequential, ${{ matrix.path }} path"; cat parallel.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Time range, frame skip and crop must give scenedetect's results too (constant frame rate clips).
      - name: Compare with scenedetect's time, --frame-skip and --crop options
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.part == 'compare')
        run: |
          status=0
          python tools/compare.py samples/sintel_trailer-480p.mp4 samples/bbb_trailer_400p.ogg samples/sintel_rotated.mp4             --detector both --stats --report options.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }}             --scenedetect-args "--crop 100 50 700 400 time -s 2s -e 00:00:20.000" --ours-args "--crop 100 50 700 400 -s 2s -e 00:00:20.000" || status=$?
          python tools/compare.py samples/sintel_trailer-480p.mp4 samples/synthetic.mp4             --detector both --report skip.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }}             --scenedetect-args "-fs 2 time -s 241 -d 300" --ours-args "--frame-skip 2 -s 241 --duration 300" || status=$?
          { echo "### time/crop and frame-skip options, ${{ matrix.path }} path, ${{ matrix.decoder }}"; cat options.md skip.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The CLI the next three steps run (compare.py builds it, but this part doesn't run compare.py first).
      - name: Build the CLI
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.path == 'core' && matrix.part == 'more')
        run: dotnet build -c Release -v q src/ShotDetector.Cli

      # save-edl, save-fcp (fcpx and fcp7), save-otio and save-qp must be byte-identical. Once: the exports don't
      # depend on the frame pipeline.
      - name: Compare timeline exports with scenedetect's
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.path == 'core' && matrix.part == 'more')
        run: python tools/compare-timeline.py

      # Several detectors, per-detector options, drop/merge, suppress, -d downscale: CSVs and stats identical.
      - name: Compare detection options with scenedetect
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.path == 'core' && matrix.part == 'more')
        run: python tools/compare-options.py

      # load-scenes: shots read back from a scene list, then re-exported; byte-identical.
      - name: Compare load-scenes with scenedetect
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.path == 'core' && matrix.part == 'more')
        run: python tools/compare-load-scenes.py

      # detect-hash is informational: on flat frames (fades to black) the perceptual hash is DCT
      # rounding noise, in scenedetect itself as much as here, so a few frames and the odd cut inside
      # a fade differ. Everything else should match; eyeball the table if it changes.
      - name: Compare detect-hash with scenedetect (informational)
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.part == 'more')
        run: |
          python tools/compare.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg             --detector hash --stats --report hash.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || true
          { echo "### detect-hash (informational), ${{ matrix.path }} path, ${{ matrix.decoder }}"; cat hash.md; } >> "$GITHUB_STEP_SUMMARY"

      # Interlaced broadcast video (issue #42): with --deinterlace auto, exact against scenedetect on a lossless yadif
      # copy (FFV1, progressive), which is what deinterlacing stands for. With deinterlacing off it's informational:
      # opencv-python 5.0.0.93 (FFmpeg 8) can't convert interlaced frames ("Cannot convert interlaced to progressive")
      # and hands scenedetect the same nearly black image for every frame; ShotDetector reads the real ones (README).
      - name: Compare interlaced broadcast video with scenedetect
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.part == 'more')
        run: |
          status=0
          fast="${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }}"
          for f in samples/broadcast/*.mxf; do ffmpeg -v error -y -i "$f" -an -vf yadif -c:v ffv1 "$f.yadif.mkv"; done
          python tools/compare.py samples/broadcast/*.mxf --detector all --stats --report off.md $fast || true
          python tools/compare.py samples/broadcast/*.mxf --detector all --stats --report auto.md $fast \
            --ours-args "--deinterlace auto" --scenedetect-on .yadif.mkv || status=$?
          { echo "### Interlaced broadcast, deinterlacing off (informational: OpenCV can't read interlaced frames), ${{ matrix.path }} path, ${{ matrix.decoder }}"; cat off.md
            echo "### Interlaced broadcast, --deinterlace auto vs a yadif copy, ${{ matrix.path }} path, ${{ matrix.decoder }}"; cat auto.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Damaged files (tools/make-broken.py): concealment as OpenCV's decoder threads give it (the default thread count),
      # and two encodes joined, whose timestamps start over and whose resolution changes (frames labelled by time, cuts
      # sorted, the new size scaled in one conversion, as scenedetect gets them). corrupt.mp4 still differs in a few
      # stats cells (backlog), so not here.
      - name: Compare damaged files with scenedetect
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.part == 'more')
        run: |
          python tools/make-broken.py > /dev/null
          fast=${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }}
          # Exact.
          status=0
          python tools/compare.py samples/broken/base.mp4 samples/broken/truncated.mp4 samples/broken/truncated.ts \
            samples/broken/dup_pts.mkv samples/broken/res_change.ts --detector all --stats --report broken.md $fast || status=$?
          # Informational: scenedetect's own results on corrupt.ts vary from run to run (its threaded error concealment).
          python tools/compare.py samples/broken/corrupt.ts --detector all --stats \
            --report broken-info.md $fast || true
          { echo "### Damaged files, ${{ matrix.path }} path, ${{ matrix.decoder }}"; cat broken.md
            echo "#### Informational"; cat broken-info.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Interlaced 10-bit (AVC-Intra 100, ProRes 422) with deinterlacing off: informational, as above (OpenCV can't
      # convert interlaced frames). Progressive 10-bit is in the exact set.
      - name: Compare interlaced 10-bit video with scenedetect (informational)
        if: needs.changes.outputs.docs_only != 'true' && (matrix.scenedetect == '0.7.2' && matrix.part == 'more')
        run: |
          python tools/compare.py samples/informational/*.mov samples/informational/*.mxf samples/informational/*.avi samples/informational/*.mkv --detector all --stats --report tenbit.md ${{ matrix.path == 'fast-yuv' && '--fast-yuv' || '' }} || true
          { echo "### Interlaced 10-bit, AVC-Intra and ProRes (informational), ${{ matrix.path }} path, ${{ matrix.decoder }}"; cat tenbit.md; } >> "$GITHUB_STEP_SUMMARY"

  # x64 and ARM give the same results end to end: every detector's scene list and per-frame stats on the main
  # comparison's clips, in-process (our FFmpeg build for each platform) and through BtbN's ffmpeg executable, written
  # on each (tools/arch-outputs.sh) and diffed. The per-pixel tests run on ARM too, but only a whole run covers
  # decoding through each platform's own native build. scenedetect on ARM isn't the reference (its OpenCV wheels use
  # KleidiCV), so x64's output is. FFmpeg's yuv420p to BGR conversion rounds differently on ARM, so arch-diff requires
  # ARM with FastYuv to equal x64 on 8-bit 4:2:0 and 4:2:2 and reports the rest (docs/decisions/2026-10-17-arm-results.md,
  # 2026-10-18-fastyuv-422.md).
  arch:
    needs: [changes, native, native-arm, samples]
    if: (github.event_name == 'pull_request') && needs.changes.outputs.light != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-26.04, btbn: linux64 }
          - { rid: linux-arm64, os: ubuntu-26.04-arm, btbn: linuxarm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      FFMPEG: '9.0'   # parity's, and the samples cache's key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - name: Install ffmpeg ${{ env.FFMPEG }}
        id: ffmpeg
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          version: ${{ env.FFMPEG }}
          platform: ${{ matrix.btbn }}

      # --ffmpeg-dir is both: the libraries for in-process decoding, the executables for the other decoder.
      - name: Its executables beside our libraries
        if: needs.changes.outputs.docs_only != 'true'
        run: cp "${{ steps.ffmpeg.outputs.bin }}/ffmpeg" "${{ steps.ffmpeg.outputs.bin }}/ffprobe" native/${{ matrix.rid }}/

      - id: samples
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples
          key: samples-${{ hashFiles('tools/make-samples.ps1') }}-ffmpeg${{ env.FFMPEG }}
          fail-on-cache-miss: true

      - name: Scene lists and stats
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          dotnet build -c Release -v q src/ShotDetector.Cli
          # The LGPL converter too (dev-only build, as compare.py --fast-yuv): does it give x64's results on ARM?
          dotnet build -c Release -v q -p:WithFastYuv=true -o fastyuv src/ShotDetector.Cli
          FASTYUV=$PWD/fastyuv/shotdetect tools/arch-outputs.sh src/ShotDetector.Cli/bin/Release/net10.0/shotdetect "$PWD/native/${{ matrix.rid }}" out \
            samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg samples/informational/*.avi \
            samples/informational/*.mkv

      # Parallel detection on ARM, as the parity job checks it on x64: three chunks on every sample, byte for byte the
      # sequential result (all five detectors, stats, 0.7.2 and 0.7.1 mode), core and FastYuv paths, in-process.
      - name: Parallel against sequential (ARM)
        if: needs.changes.outputs.docs_only != 'true' && matrix.rid == 'linux-arm64'
        env:
          SHOTDETECTOR_OURS_ARGS: --ffmpeg-dir ${{ github.workspace }}/native/${{ matrix.rid }} --decoder inprocess
        run: |
          status=0
          for path in core fast-yuv; do
            python3 tools/compare-parallel.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg \
              --chunks 3 --report parallel-$path.md $([ $path = fast-yuv ] && echo --fast-yuv) || status=1
            { echo "### Parallel against sequential on ARM, $path path"; cat parallel-$path.md; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.changes.outputs.docs_only != 'true'
        with:
          name: arch-${{ matrix.rid }}
          path: out

  arch-diff:
    needs: [changes, arch]
    if: (github.event_name == 'pull_request') && needs.changes.outputs.light != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: arch-*

      # Not vacuous: both sides wrote the same, non-zero number of files. Then what differs, and how much, in the summary;
      # it fails unless ARM's FastYuv results equal x64's on every even-sized 8-bit 4:2:0 and 4:2:2 clip.
      - name: x64 and ARM give the same files
        run: |
          a=$(ls arch-linux-x64 | wc -l) b=$(ls arch-linux-arm64 | wc -l)
          echo "x64: $a files, ARM: $b files"
          if [ "$a" -eq 0 ] || [ "$a" -ne "$b" ]; then echo "::error::Expected the same, non-zero number of files"; exit 1; fi
          set -o pipefail
          python3 tools/arch-summary.py arch-linux-x64 arch-linux-arm64 | tee -a "$GITHUB_STEP_SUMMARY"

  # The one check branch protection requires from this workflow: every job above passed or was skipped (a light PR
  # skips the heavy ones, and a skipped matrix job doesn't report its per-matrix check names).
  passed:
    name: CI passed
    needs: [changes, line-endings, native, build, aot, native-arm, arm, alpine, samples, parity, arch, arch-diff]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
