name: Parity on Windows and macOS

# The main comparison with scenedetect on Windows and macOS: informational (Linux is the reference, ci.yml's parity
# jobs). The Windows OpenCV wheel bundles FFmpeg 7.1, which converts with BT.601 whatever the colour tags say;
# compare.py passes --always-bt601 there, as README says users must. macOS's ARM wheel uses KleidiCV and Carotene,
# which round resize and HSV differently (README, docs/decisions/). Nightly rather than on every pull request: it
# fails nothing, and runners are CI's limit (concurrent jobs count per account; this takes one of the 5 macOS slots).
# Parallel detection against sequential runs here too, in-process with our FFmpeg build, and that step does fail.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'
  # And on a pull request that changes this workflow or the ffmpeg action it uses, so a change is tested before it merges.
  pull_request:
    paths:
      - .github/workflows/parity-os.yml
      - .github/actions/btbn-ffmpeg/**

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # Our FFmpeg build for these platforms (native.yml, cached), for the in-process parallel check.
  native:
    uses: ./.github/workflows/native.yml
    with:
      rids: '["win-x64","osx-arm64"]'

  parity-os:
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # Windows: BtbN's FFmpeg 9.0, as the Linux comparison (pinned series, retries, cached per day; Chocolatey's
      # install failed once, #234). macOS: Homebrew's (BtbN has no macOS build).
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        uses: ./.github/actions/btbn-ffmpeg
        with:
          version: '9.0'
          platform: win64

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg > /dev/null && ffmpeg -hide_banner -version | head -1

      - name: Install scenedetect
        run: pip install scenedetect==0.7.2 opencv-python-headless==5.0.0.93

      # main's samples job's clips (made on Linux), else made here.
      - id: samples
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: samples
          key: samples-${{ hashFiles('tools/make-samples.ps1') }}-ffmpeg9.0
          enableCrossOsArchive: true

      - name: Make sample clips
        if: steps.samples.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/make-samples.ps1

      - name: Compare with scenedetect (informational)
        shell: bash
        run: |
          python tools/compare.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg \
            --detector all --stats --report parity.md || true
          { echo "### scenedetect 0.7.2 on ${{ matrix.os }} (informational)"; cat parity.md 2>/dev/null || echo "No report."; } >> "$GITHUB_STEP_SUMMARY"

      # Outside native/, so the comparison above keeps its decoder; only the parallel check gets them (--ffmpeg-dir).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-${{ matrix.rid }}
          path: ffmpeg-libs/${{ matrix.rid }}

      # Parallel detection (DetectionOptions.Mode) as ci.yml checks it on Linux: three chunks on every sample, byte
      # for byte the sequential result, in-process.
      - name: Parallel against sequential
        shell: bash
        env:
          SHOTDETECTOR_OURS_ARGS: --ffmpeg-dir ${{ github.workspace }}/ffmpeg-libs/${{ matrix.rid }} --decoder inprocess
        run: |
          status=0
          python tools/compare-parallel.py samples/*.mp4 samples/*.mov samples/*.m4v samples/*.ogg samples/*.mkv samples/*.avi samples/*.mpg \
            --chunks 3 --report parallel.md || status=$?
          { echo "### Parallel against sequential on ${{ matrix.os }}"; cat parallel.md 2>/dev/null || echo "No report."; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
