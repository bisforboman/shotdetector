name: Release

# Merging a release PR releases. Two products, released separately (docs/frame-reader-product.md):
# - ShotDetector: CHANGELOG.md's newest version ("## X.Y.Z – date"), tag vX.Y.Z; ShotDetector, ShotDetector.FastYuv,
#   the ShotDetector.Cli tool and its Native AOT binaries (ShotDetector.Native, aliases of FrameReader.Native, ended
#   with 2.x).
# - FrameReader: src/FrameReader/CHANGELOG.md's newest version, tag framereader-vX.Y.Z; FrameReader and
#   FrameReader.Native.<rid> (and the meta-package).
# On every push to main, each product whose newest version isn't tagged yet is released: built, published to nuget.org
# (FrameReader first, as ShotDetector depends on it), and given its own GitHub release. Prereleases only (a '-' in
# every due version) use the 'prerelease' environment, others 'release', which waits for approval. Pushing a v* or
# framereader-v* tag by hand still releases that product at that version.

on:
  push:
    branches: [main]
    tags: ['v*', 'framereader-v*']

# One release at a time, never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Each product's version, and which still need releasing (most pushes to main: none, and nothing else runs).
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      shotdetector: ${{ steps.version.outputs.shotdetector }}
      framereader: ${{ steps.version.outputs.framereader }}
      shotdetector-due: ${{ steps.version.outputs.shotdetector-due }}
      framereader-due: ${{ steps.version.outputs.framereader-due }}
      release: ${{ steps.version.outputs.release }}
      environment: ${{ steps.version.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          newest() { grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+[^ ]*' "$1" | cut -c4-; }
          sd=$(newest CHANGELOG.md); fr=$(newest src/FrameReader/CHANGELOG.md)
          sd_due=false; fr_due=false
          case "$GITHUB_REF_TYPE/$GITHUB_REF_NAME" in
            tag/framereader-v*) fr="${GITHUB_REF_NAME#framereader-v}"; fr_due=true ;;
            tag/v*) sd="${GITHUB_REF_NAME#v}"; sd_due=true ;;
            *)
              git ls-remote --exit-code --tags origin "refs/tags/v$sd" > /dev/null || sd_due=true
              git ls-remote --exit-code --tags origin "refs/tags/framereader-v$fr" > /dev/null || fr_due=true ;;
          esac
          release=false; env=prerelease
          for p in "shotdetector $sd $sd_due" "framereader $fr $fr_due"; do
            set -- $p
            if [ "$3" = true ]; then
              release=true
              [[ "$2" == *-* ]] || env=release
              echo "Releasing $1 $2" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$1 $2 is already released" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          { echo "shotdetector=$sd"; echo "framereader=$fr"; echo "shotdetector-due=$sd_due"; echo "framereader-due=$fr_due"
            echo "release=$release"; echo "environment=$env"; } >> "$GITHUB_OUTPUT"

  # The baseline issues (see `baseline` below) close themselves once Directory.Build.props has that version: on every
  # push to main, an open "Set ApiBaselineVersion to X" (ShotDetector) or "Set FrameReaderApiBaselineVersion to X" issue
  # is closed when X is that property's value.
  baseline-done:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Close the baseline issues for the props file's versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prop in ApiBaselineVersion FrameReaderApiBaselineVersion; do
            v=$(grep -oP "(?<=<$prop>)[^<]+" Directory.Build.props || true)
            [ -n "$v" ] || continue
            title="Set $prop to $v"
            gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | while read -r n; do
              gh issue close "$n" --reason completed --comment "Directory.Build.props has \`<$prop>$v</$prop>\` on main ($GITHUB_SHA)."
            done
          done

  # Our FFmpeg build for every platform (native.yml, cached): the FrameReader.Native.<rid> packages, and bundled in
  # the CLI tool and binaries.
  native:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/native.yml

  release:
    needs: [version, native]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: ${{ needs.version.outputs.environment }}
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # request the OIDC token that NuGet/login exchanges for a temporary API key
      attestations: write   # build provenance for the packages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Versions
        run: |
          { echo "SD=${{ needs.version.outputs.shotdetector }}"; echo "FR=${{ needs.version.outputs.framereader }}"
            echo "SD_DUE=${{ needs.version.outputs.shotdetector-due }}"; echo "FR_DUE=${{ needs.version.outputs.framereader-due }}"; } >> "$GITHUB_ENV"

      - name: Install ffmpeg   # for the video tests
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg

      - name: Test
        run: dotnet test ShotDetector.slnx

      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: native

      # Each product at its own version (never -p:Version: through ShotDetector's reference it would stamp FrameReader
      # too). ShotDetector's package depends on FrameReader at $FR: the one released now, or the newest one before.
      # Only the due products' packages go to artifacts/ (the others' land in unused/).
      - name: Pack
        run: |
          for d in native/native-*; do mv "$d" "native/${d#native/native-}"; done
          versions="-p:ShotDetectorVersion=$SD -p:FrameReaderVersion=$FR"
          fr_out=unused; [ "$FR_DUE" = true ] && fr_out=artifacts
          rids="win-x64 linux-x64 linux-arm64 linux-musl-x64 osx-arm64 all"   # all: the meta-package
          dotnet pack src/FrameReader --configuration Release $versions --output $fr_out
          for rid in $rids; do dotnet pack src/FrameReader.Native -p:Rid=$rid $versions --output $fr_out; done
          if [ "$SD_DUE" = true ]; then
            dotnet pack src/ShotDetector --configuration Release $versions --output artifacts
            dotnet pack src/ShotDetector.FastYuv --configuration Release $versions --output artifacts
            dotnet pack src/ShotDetector.Cli --configuration Release $versions --output artifacts
          fi

      # Signed provenance (built by this workflow from this commit): gh attestation verify <file> --repo bisforboman/shotdetector
      - name: Attest the packages
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'artifacts/*.nupkg, artifacts/*.snupkg'

      # Request the temporary key right before pushing: it is valid for one hour.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # One file at a time, each with a few tries, packages first and then their symbols: an error from nuget.org on
        # one (1.0.0's Cli push got a 500 after a 5-minute upload) doesn't stop the others, and a re-run still sends the
        # symbols of a package that is already there (--skip-duplicate skips both together otherwise).
        run: |
          failed=0
          # FrameReader first: ShotDetector's package depends on it.
          for f in $(ls artifacts/FrameReader.*.nupkg artifacts/FrameReader.*.snupkg 2>/dev/null) \
                   $(ls artifacts/*.nupkg artifacts/*.snupkg | grep -v '/FrameReader\.'); do
            case "$f" in *.nupkg) only=--no-symbols ;; *) only= ;; esac   # a package's symbols get their own turn
            for try in 1 2 3; do
              if dotnet nuget push "$f" $only --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; then
                break
              elif [ "$try" -lt 3 ]; then
                sleep 60
              else
                echo "::error::Pushing $f failed"
                failed=1
              fi
            done
          done
          exit $failed

      - name: GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        # One per due product: its tag on this commit (unless pushed by hand), its CHANGELOG section ("## X.Y.Z – date"
        # up to the next "## ") as the notes, else GitHub's PR list, and its packages. GitHub's "Latest" stays
        # ShotDetector's (the repository's front page and the CLI binaries): FrameReader's are never marked latest.
        run: |
          release() {   # tag, title, version, changelog, packages...
            local tag=$1 title=$2 v=$3 log=$4; shift 4
            local prerelease=""; [[ "$v" == *-* ]] && prerelease="--prerelease"
            awk -v v="## $v " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' "$log" > notes.md
            if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$tag" "$@" --target "$GITHUB_SHA" --title "$title" "${notes[@]}" $prerelease ${latest:-}
          }
          if [ "$FR_DUE" = true ]; then
            latest=--latest=false release "framereader-v$FR" "FrameReader $FR" "$FR" src/FrameReader/CHANGELOG.md artifacts/FrameReader.*.nupkg
          fi
          if [ "$SD_DUE" = true ]; then
            release "v$SD" "ShotDetector $SD" "$SD" CHANGELOG.md $(ls artifacts/*.nupkg | grep -v '/FrameReader\.')
          fi

  # A stable release: an issue per product to make it the API baseline (Directory.Build.props), once nuget.org serves
  # it, since package validation downloads the baseline. An issue rather than a PR: a PR opened with this token gets no
  # CI runs.
  baseline:
    needs: [version, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      issues: write
    steps:
      - name: Issues to move the API baselines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SD: ${{ needs.version.outputs.shotdetector }}
          FR: ${{ needs.version.outputs.framereader }}
          SD_DUE: ${{ needs.version.outputs.shotdetector-due }}
          FR_DUE: ${{ needs.version.outputs.framereader-due }}
        run: |
          issue() {   # due, version, package id (lower case), property
            local due=$1 v=$2 id=$3 prop=$4
            [ "$due" = true ] && [[ "$v" != *-* ]] || return 0
            for i in $(seq 1 60); do
              curl -fsSL "https://api.nuget.org/v3-flatcontainer/$id/index.json" | grep -q "\"$v\"" && break
              [ "$i" = 60 ] && echo "::warning::nuget.org doesn't list $id $v after an hour; opening the issue anyway"
              sleep 60
            done
            local title="Set $prop to $v"
            if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
              echo "Already filed: $title"
              return 0
            fi
            gh issue create --title "$title" --body "$v is on nuget.org. Make it the API baseline, so packing fails on any breaking change from it (SDK package validation, CP000x errors):

          - [ ] In \`Directory.Build.props\`: \`<$prop>$v</$prop>\`, in a PR (main is protected).

          Opened by release.yml after publishing."
          }
          issue "$FR_DUE" "$FR" framereader FrameReaderApiBaselineVersion
          issue "$SD_DUE" "$SD" shotdetector ApiBaselineVersion

  # Standalone shotdetect binaries (no .NET needed; ffmpeg still is), attached to the release.
  binaries:
    needs: [version, native, release]
    if: needs.version.outputs.shotdetector-due == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-26.04 }
          - { rid: linux-musl-x64, os: ubuntu-26.04, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    permissions:
      contents: write   # upload release assets
      id-token: write   # sign the attestation
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Native toolchain (Alpine)
        if: matrix.rid == 'linux-musl-x64'
        shell: sh   # bash isn't installed yet
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache clang build-base zlib-dev bash github-cli zip

      - uses: actions/setup-dotnet@v6
        if: matrix.rid != 'linux-musl-x64'
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - name: Publish
        run: |
          dotnet publish src/ShotDetector.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -p:ShotDetectorVersion=${{ needs.version.outputs.shotdetector }} -p:FrameReaderVersion=${{ needs.version.outputs.framereader }} -o out
          rm -f out/*.pdb out/*.dbg

      - name: Archive
        run: |
          name=shotdetect-v${{ needs.version.outputs.shotdetector }}-${{ matrix.rid }}
          cp LICENSE THIRD-PARTY-NOTICES.md src/FrameReader.Native/COPYING.LGPL src/FrameReader.Native/COPYING.dav1d native/${{ matrix.rid }}/configure.txt native/${{ matrix.rid }}/sbom.spdx.json out/
          case "${{ matrix.rid }}" in linux-*) cp src/FrameReader.Native/COPYING.openssl out/ ;; esac
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            (cd out && 7z a "../$name.zip" . > /dev/null) && file="$name.zip"
          else
            tar -czf "$name.tar.gz" -C out . && file="$name.tar.gz"
          fi
          echo "ARCHIVE=$file" >> "$GITHUB_ENV"

      - name: Attest the binaries
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.version.outputs.shotdetector }}" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
