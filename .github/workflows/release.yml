name: Release

# Merging a release PR releases: CHANGELOG.md's newest version ("## X.Y.Z – date"), tag vX.Y.Z, as ShotDetector,
# ShotDetector.FastYuv, the ShotDetector.Cli tool and its Native AOT binaries, with a GitHub release. On every push to
# main, the newest version is released if it isn't tagged yet. A prerelease (a '-' in the version) uses the
# 'prerelease' environment, others 'release', which waits for approval. Pushing a v* tag by hand still releases that
# version. FrameReader, which ShotDetector depends on, is released from its own repository
# (github.com/bisforboman/FrameReader); its framereader-v* tags here are the releases made before the move.
# Only the newest version can be released from main, so the run fails when an older stable version newer than the
# newest tag is untagged (a release PR merged while the one before it still waited): see the version job.

on:
  push:
    branches: [main]
    tags: ['v*']

# One release at a time, never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

# The default token for every job: read the repository, nothing else (jobs that need more say so).
permissions:
  contents: read

jobs:
  # The version, and whether it still needs releasing (most pushes to main: no, and nothing else runs).
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      shotdetector: ${{ steps.version.outputs.shotdetector }}
      shotdetector-due: ${{ steps.version.outputs.shotdetector-due }}
      release: ${{ steps.version.outputs.release }}
      environment: ${{ steps.version.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: version
        run: |
          sd=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+[^ ]*' CHANGELOG.md | cut -c4-)
          sd_due=false
          case "$GITHUB_REF_TYPE/$GITHUB_REF_NAME" in
            tag/v*) sd="${GITHUB_REF_NAME#v}"; sd_due=true ;;
            *)
              git ls-remote --exit-code --tags origin "refs/tags/v$sd" > /dev/null || sd_due=true
              # Never skip a stable version silently: each run releases the newest version only, so an older one newer
              # than the newest tag (approved after the next release PR merged, or its run cancelled) would never be
              # published. Fail naming it instead (2026-11-06: FrameReader 2.24.0 went out only in 2.25.0).
              tags=$(git ls-remote --tags origin 'refs/tags/v*' | sed -E 's|.*refs/tags/||; s|\^\{\}$||' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's|^v||' | sort -uV)
              newest_tag=$(tail -n1 <<< "$tags")
              bad=0
              for v in $(grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+( |$)' CHANGELOG.md | cut -c4- | tr -d ' '); do
                [ "$v" != "$sd" ] || continue
                [ -z "$newest_tag" ] || [ "$(printf '%s\n%s\n' "$newest_tag" "$v" | sort -V | tail -n1)" != "$newest_tag" ] || continue
                grep -qxF "$v" <<< "$tags" && continue
                msg="ShotDetector $v is in CHANGELOG.md but untagged and older than $sd, which this run would release: $v would never be published. Tag $v's release commit by hand (v$v) to release it first, or, to leave it out on purpose, tag $sd's release commit by hand (v$sd)."
                echo "::error::$msg"; echo "**Skipped:** $msg" >> "$GITHUB_STEP_SUMMARY"
                bad=1
              done
              [ "$bad" = 0 ] || exit 1 ;;
          esac
          env=release; [[ "$sd" == *-* ]] && env=prerelease
          if [ "$sd_due" = true ]; then echo "Releasing ShotDetector $sd" >> "$GITHUB_STEP_SUMMARY"; else echo "ShotDetector $sd is already released" >> "$GITHUB_STEP_SUMMARY"; fi
          { echo "shotdetector=$sd"; echo "shotdetector-due=$sd_due"; echo "release=$sd_due"; echo "environment=$env"; } >> "$GITHUB_OUTPUT"

  # The baseline issue (see `baseline` below) closes itself once Directory.Build.props has that version: on every push
  # to main, an open "Set ApiBaselineVersion to X" issue is closed when X is that property's value.
  baseline-done:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Close the baseline issues for the props file's versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prop in ApiBaselineVersion; do
            v=$(grep -oP "(?<=<$prop>)[^<]+" Directory.Build.props || true)
            [ -n "$v" ] || continue
            title="Set $prop to $v"
            gh issue list --state open --search "\"$title\" in:title" --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" | while read -r n; do
              gh issue close "$n" --reason completed --comment "Directory.Build.props has \`<$prop>$v</$prop>\` on main ($GITHUB_SHA)."
            done
          done

  # Our FFmpeg build for every platform (FrameReader.Native's, native-package.yml), bundled in the CLI tool and
  # binaries.
  native:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/native-package.yml

  # The tests, with BtbN's ffmpeg (a third-party build) for the video tests: in a job of their own with read-only
  # permissions, so no third-party binary runs where the NuGet publishing token and write access are (security review,
  # 2026-10-16).
  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg   # for the video tests
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg

      - name: Test
        run: dotnet test ShotDetector.slnx --logger GitHubActions

  # Packs, attests and publishes: only our own code and our FFmpeg build (FrameReader.Native's, signature-checked) run
  # here.
  release:
    needs: [version, native, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: ${{ needs.version.outputs.environment }}
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # request the OIDC token that NuGet/login exchanges for a temporary API key
      attestations: write   # build provenance for the packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Versions
        run: |
          echo "SD=${{ needs.version.outputs.shotdetector }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: native

      # The CLI bundles native/<rid>/ (ShotDetector.Cli.csproj).
      - name: Pack
        run: |
          for d in native/native-*; do mv "$d" "native/${d#native/native-}"; done
          for p in src/ShotDetector src/ShotDetector.FastYuv src/ShotDetector.Cli; do
            dotnet pack $p --configuration Release -p:ShotDetectorVersion=$SD --output artifacts
          done

      # Signed provenance (built by this workflow from this commit): gh attestation verify <file> --repo bisforboman/shotdetector
      - name: Attest the packages
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*.nupkg, artifacts/*.snupkg'

      # Request the temporary key right before pushing: it is valid for one hour.
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # One file at a time, each with a few tries, packages first and then their symbols: an error from nuget.org on
        # one (1.0.0's Cli push got a 500 after a 5-minute upload) doesn't stop the others, and a re-run still sends the
        # symbols of a package that is already there (--skip-duplicate skips both together otherwise).
        run: |
          failed=0
          for f in artifacts/*.nupkg artifacts/*.snupkg; do
            case "$f" in *.nupkg) only=--no-symbols ;; *) only= ;; esac   # a package's symbols get their own turn
            for try in 1 2 3; do
              if dotnet nuget push "$f" $only --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate; then
                break
              elif [ "$try" -lt 3 ]; then
                sleep 60
              else
                echo "::error::Pushing $f failed"
                failed=1
              fi
            done
          done
          exit $failed

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Its tag on this commit (unless pushed by hand), its CHANGELOG section ("## X.Y.Z – date" up to the next "## ")
        # as the notes, else GitHub's PR list, and its packages.
        run: |
          prerelease=""; [[ "$SD" == *-* ]] && prerelease="--prerelease"
          awk -v v="## $SD " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$SD" artifacts/*.nupkg --target "$GITHUB_SHA" --title "ShotDetector $SD" "${notes[@]}" $prerelease

  # A stable release: an issue to make it the API baseline (Directory.Build.props), once nuget.org serves it, since
  # package validation downloads the baseline. An issue rather than a PR: a PR opened with this token gets no
  # CI runs.
  baseline:
    needs: [version, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    permissions:
      issues: write
    steps:
      - name: Issues to move the API baselines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SD: ${{ needs.version.outputs.shotdetector }}
          SD_DUE: ${{ needs.version.outputs.shotdetector-due }}
        run: |
          issue() {   # due, version, package id (lower case), property
            local due=$1 v=$2 id=$3 prop=$4
            [ "$due" = true ] && [[ "$v" != *-* ]] || return 0
            for i in $(seq 1 60); do
              curl -fsSL "https://api.nuget.org/v3-flatcontainer/$id/index.json" | grep -q "\"$v\"" && break
              [ "$i" = 60 ] && echo "::warning::nuget.org doesn't list $id $v after an hour; opening the issue anyway"
              sleep 60
            done
            local title="Set $prop to $v"
            if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
              echo "Already filed: $title"
              return 0
            fi
            gh issue create --title "$title" --body "$v is on nuget.org. Make it the API baseline, so packing fails on any breaking change from it (SDK package validation, CP000x errors):

          - [ ] In \`Directory.Build.props\`: \`<$prop>$v</$prop>\`, in a PR (main is protected).

          Opened by release.yml after publishing."
          }
          issue "$SD_DUE" "$SD" shotdetector ApiBaselineVersion

  # Standalone shotdetect binaries (no .NET needed, FFmpeg's libraries next to them; the ffmpeg executable only for the
  # image and clip exports and some URLs), attached to the release. ci.yml's aot job builds the same matrix.
  # Each archive is checked before it's uploaded (tools/check-binary.sh, which ci.yml's aot job runs on the archive a
  # pull request builds the same way): unpacked into an empty folder, it prints the release's version and decodes the
  # clip job's clips in-process with no ffmpeg on PATH.
  binaries:
    needs: [version, native, release, clip]
    if: needs.version.outputs.shotdetector-due == 'true'
    strategy:
      fail-fast: false
      matrix:
        # The Alpine SDK image by digest (10.0-alpine; Dependabot doesn't update container images: move it by hand,
        # with ci.yml's two).
        include:
          - { rid: linux-x64, os: ubuntu-26.04 }
          - { rid: linux-arm64, os: ubuntu-26.04-arm }
          - { rid: linux-musl-x64, os: ubuntu-26.04, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine@sha256:5562fd626eec39f6f53218f9b7d7856ab7195d51d846568304fbe85071a3b6e6' }
          - { rid: win-x64, os: windows-2025 }   # as ci.yml's aot job, pinned like Ubuntu
          - { rid: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    permissions:
      contents: write   # upload release assets
      id-token: write   # sign the attestation
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Native toolchain (Alpine)
        if: matrix.rid == 'linux-musl-x64'
        shell: sh   # bash isn't installed yet
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache clang build-base zlib-dev bash github-cli zip

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        if: matrix.rid != 'linux-musl-x64'
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clip
          path: clip

      - name: Publish
        run: |
          dotnet publish src/ShotDetector.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -p:ShotDetectorVersion=${{ needs.version.outputs.shotdetector }} -o out

      - name: Archive
        run: echo "ARCHIVE=$(tools/archive-binary.sh ${{ matrix.rid }} ${{ needs.version.outputs.shotdetector }})" >> "$GITHUB_ENV"

      - name: The archive runs on its own
        run: tools/check-binary.sh "$ARCHIVE" "${{ needs.version.outputs.shotdetector }}" clip

      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.version.outputs.shotdetector }}" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"

  # The clips the binaries job decodes (tools/check-binary.sh --clips), made once on Linux with BtbN's ffmpeg: macOS
  # has no pinned build, and the binaries are checked without ffmpeg anyway.
  clip:
    needs: version
    if: needs.version.outputs.shotdetector-due == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ffmpeg
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg

      - name: Clips
        run: tools/check-binary.sh --clips clip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: clip
          path: clip/
