name: Release

# Merging a release PR releases: on every push to main this checks the newest version in CHANGELOG.md
# ("## X.Y.Z – date"), and if v<X.Y.Z> isn't tagged yet, builds and publishes ShotDetector, ShotDetector.FastYuv,
# ShotDetector.Native.<rid> and the ShotDetector.Cli tool to nuget.org, creates the GitHub release with that tag
# and attaches the Native AOT binaries. Prereleases (a '-' in the version) use the 'prerelease' environment, others
# 'release', which waits for approval. Pushing a v* tag by hand still releases that tag.

on:
  push:
    branches: [main]
    tags: ['v*']

# One release at a time, never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Which version, and whether it still needs releasing (most pushes to main: no, and nothing else runs).
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+[^ ]*' CHANGELOG.md | cut -c4-)
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] || ! git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $v" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "v$v is already released" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Our FFmpeg build for every platform (native.yml, cached): the ShotDetector.Native.<rid> packages, and bundled in
  # the CLI tool and binaries.
  native:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/native.yml

  release:
    needs: [version, native]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ contains(needs.version.outputs.version, '-') && 'prerelease' || 'release' }}
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # request the OIDC token that NuGet/login exchanges for a temporary API key
      attestations: write   # build provenance for the packages
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Install ffmpeg   # for the video tests
        timeout-minutes: 10   # package mirrors sometimes hang
        run: |
          # BtbN's static FFmpeg 8.1, from GitHub's servers: the apt mirrors hung twice (2026-10-07).
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n8.1-latest-linux64-gpl-8.1/bin" >> "$GITHUB_PATH"

      - name: Test
        run: dotnet test ShotDetector.slnx

      - uses: actions/download-artifact@v7
        with:
          pattern: native-*
          path: native

      - name: Pack
        run: |
          for d in native/native-*; do mv "$d" "native/${d#native/native-}"; done
          for rid in win-x64 linux-x64 linux-arm64 linux-musl-x64 osx-arm64; do
            dotnet pack src/ShotDetector.Native -p:Rid=$rid -p:Version=$VERSION --output artifacts
          done
          dotnet pack src/ShotDetector --configuration Release -p:Version=$VERSION --output artifacts
          dotnet pack src/ShotDetector.FastYuv --configuration Release -p:Version=$VERSION --output artifacts
          dotnet pack src/ShotDetector.Cli --configuration Release -p:Version=$VERSION --output artifacts

      # Signed provenance (built by this workflow from this commit): gh attestation verify <file> --repo bisforboman/shotdetector
      - name: Attest the packages
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'artifacts/*.nupkg, artifacts/*.snupkg'

      # Request the temporary key right before pushing: it is valid for one hour.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          # The version's CHANGELOG.md section ("## 0.5.0 – date" up to the next "## "), else GitHub's PR list.
          awk -v v="## $VERSION " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          # Creates the tag v$VERSION on this commit, unless it was pushed by hand.
          gh release create "v$VERSION" artifacts/*.nupkg --target "$GITHUB_SHA" --title "ShotDetector $VERSION" "${notes[@]}" $prerelease

  # Standalone shotdetect binaries (no .NET needed; ffmpeg still is), attached to the release.
  binaries:
    needs: [version, native, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-musl-x64, os: ubuntu-latest, container: 'mcr.microsoft.com/dotnet/sdk:10.0-alpine' }
          - { rid: win-x64, os: windows-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    permissions:
      contents: write   # upload release assets
      id-token: write   # sign the attestation
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Native toolchain (Alpine)
        if: matrix.rid == 'linux-musl-x64'
        shell: sh   # bash isn't installed yet
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache clang build-base zlib-dev bash github-cli zip

      - uses: actions/setup-dotnet@v6
        if: matrix.rid != 'linux-musl-x64'
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - name: Publish
        run: |
          VERSION=${{ needs.version.outputs.version }}
          dotnet publish src/ShotDetector.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:Version=$VERSION -o out
          rm -f out/*.pdb out/*.dbg

      - name: Archive
        run: |
          name=shotdetect-v${{ needs.version.outputs.version }}-${{ matrix.rid }}
          cp LICENSE THIRD-PARTY-NOTICES.md src/ShotDetector.Native/COPYING.LGPL src/ShotDetector.Native/COPYING.dav1d native/${{ matrix.rid }}/configure.txt out/
          if [ "${{ matrix.rid }}" = win-x64 ]; then
            (cd out && 7z a "../$name.zip" . > /dev/null) && file="$name.zip"
          else
            tar -czf "$name.tar.gz" -C out . && file="$name.tar.gz"
          fi
          echo "ARCHIVE=$file" >> "$GITHUB_ENV"

      - name: Attest the binaries
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.version.outputs.version }}" "$ARCHIVE" --repo "$GITHUB_REPOSITORY"
