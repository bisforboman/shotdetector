name: CodeQL

# GitHub's code scanning for the C# (build-free mode: no compile needed): every pull request, every push to main, and
# weekly, so new queries look at old code too. Findings are under Security > Code scanning; not a required check.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
