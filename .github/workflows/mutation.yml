name: Mutation testing

# Breaks each guard listed in tools/mutation/mutations.psd1 and checks that a test fails. A pull request runs the
# mutations its changed files concern (tools/mutation/Invoke-Mutations.ps1 -OnlyFiles); every one runs nightly on main,
# and a failed night opens an issue (or comments on the open one). docs/decisions/2026-10-31-ci-time.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * *'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # Which mutations a pull request's files concern, as a matrix of shards: one per 40 selected (about 15 minutes each),
  # at most 3, none when it selects none (a docs PR), all of them when it changes the mutation testing itself. Light PRs
  # (tools/ci-changes.sh) run theirs too: FrameReader files ShotDetector doesn't run have guards of their own. Nightly
  # and on demand: all of them in 3 shards. Every entry's Find is checked here either way (no build needed).
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.select.outputs.shards }}
      matrix: ${{ steps.select.outputs.matrix }}
      all: ${{ steps.select.outputs.all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - id: select
        shell: pwsh
        run: |
          $files = @(git diff --name-only HEAD^1 HEAD)
          # A pull request that changes the mutation testing itself runs all of it, as the nightly does.
          $all = '${{ github.event_name }}' -ne 'pull_request' -or ($files -match '^(tools/mutation/Invoke-Mutations\.ps1|\.github/workflows/mutation\.yml)$')
          if (-not $all) {
            $count = [int](./tools/mutation/Invoke-Mutations.ps1 -Count -OnlyFiles $files -Base HEAD^1)
            $shards = [Math]::Min(3, [Math]::Ceiling($count / 40))
            "$count of the mutations concern this pull request's files: $shards shard(s)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
          else {
            ./tools/mutation/Invoke-Mutations.ps1 -Count | Out-Null
            $shards = 3
          }
          "shards=$shards" >> $env:GITHUB_OUTPUT
          "all=$($all.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "matrix=$(ConvertTo-Json -Compress @(0..([Math]::Max(1, $shards) - 1)))" >> $env:GITHUB_OUTPUT

  mutate:
    if: needs.changes.outputs.shards != '0'
    needs: changes
    name: mutate (${{ matrix.shard }}/${{ needs.changes.outputs.shards }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg

      # FFmpeg's shared libraries too, so the in-process tests run (they pass without checking otherwise).
      - name: FFmpeg 8.1, shared
        id: libs
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared
          add-to-path: 'false'

      - name: Mutate the guards
        shell: pwsh
        env:
          SHOTDETECTOR_FFMPEG_LIBS: ${{ steps.libs.outputs.bin }}
        run: |
          $only = if ('${{ needs.changes.outputs.all }}' -ne 'true') { @{ OnlyFiles = @(git diff --name-only HEAD^1 HEAD); Base = 'HEAD^1' } } else { @{} }
          ./tools/mutation/Invoke-Mutations.ps1 -Shard ${{ matrix.shard }} -Shards ${{ needs.changes.outputs.shards }} @only

  # The check branch protection requires ("mutation"): every job passed or was skipped (a light PR, or one whose files
  # no mutation concerns, skips the shards).
  mutation:
    needs: [changes, mutate]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # A failed night: an issue, or a comment on the one still open, so it isn't missed (tools/nightly-issue.sh).
  report:
    needs: mutation
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: tools/nightly-issue.sh "Nightly mutation testing failed" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
