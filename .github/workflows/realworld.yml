name: Real world

# ShotDetector and scenedetect on real public videos (tools/realworld.py: whole Blender open movies and short
# clips in every common codec): cuts, scene lists and per-frame stats must be identical for every detector.
# Nightly, so a new ffmpeg/scenedetect/OpenCV release that changes a result is noticed the next morning.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: realworld-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only pull requests (docs/ and *.md): the jobs below still run, so their required checks report, but skip
  # their steps. Decided here, on a runner with git, from the PR's merge commit against its base.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      light: ${{ steps.diff.outputs.light }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only HEAD^1 HEAD)
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then echo docs_only=true >> "$GITHUB_OUTPUT"; fi
          # Light: only docs, the benchmarks, FrameReader's tests or FrameReader code ShotDetector doesn't use (its
          # results can't change): the heavy jobs don't start at all.
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$|^\.claude/|^benchmarks/|^tests/FrameReader\.Tests/|^src/FrameReader/(VideoFrameReader|AudioReader)\.cs$'; then echo light=true >> "$GITHUB_OUTPUT"; fi

  realworld:
    if: needs.changes.outputs.light != 'true'
    needs: changes
    name: Real world (${{ matrix.video }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        video:
          - bbb_640x360_h264.mp4
          - elephants_dream_426x240_h264.mp4
          - tears_of_steel_1280x534_h264.mov
          - bbb_10s_h264.mp4
          - bbb_10s_h265.mp4
          - bbb_10s_vp9.webm
          # Not bbb_10s_av1.mp4: OpenCV's Linux wheel has no software AV1 decoder (it opens the file and
          # reads 0 frames), so scenedetect has nothing to compare with here. It matches on Windows.
    env:
      FFMPEG: '9.0'   # the latest stable FFmpeg; BtbN's static build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG.tar.xz" | tar -xJ
          echo "$PWD/ffmpeg-n$FFMPEG-latest-linux64-gpl-$FFMPEG/bin" >> "$GITHUB_PATH"

      - name: Install scenedetect
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install scenedetect==0.7.1 opencv-python-headless==5.0.0.93

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet build src/ShotDetector.Cli -c Release

      - name: Cache the video
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@v5
        with:
          path: samples/realworld
          key: realworld-${{ matrix.video }}-${{ hashFiles('tools/realworld.py') }}

      - name: Compare with scenedetect
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          python tools/realworld.py ${{ matrix.video }} --report realworld.md || status=$?
          { echo "### ${{ matrix.video }}"; cat realworld.md; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
