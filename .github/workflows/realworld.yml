name: Real world

# ShotDetector and scenedetect on real public videos (tools/realworld.py: whole Blender open movies and short
# clips in every common codec): cuts, scene lists and per-frame stats must be identical for every detector. And
# FrameReader's audio on the films' soundtracks, identical to ffmpeg's.
# Nightly, so a new ffmpeg/scenedetect/OpenCV release that changes a result is noticed the next morning.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # drafts run nothing until marked ready
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: realworld-${{ github.ref }}
  cancel-in-progress: true

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # Docs-only pull requests (docs/ and *.md): the jobs below still run, so their required checks report, but skip
  # their steps. Decided here, on a runner with git, from the PR's merge commit against its base.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      light: ${{ steps.diff.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      # FrameReader's assemblies are built when only FrameReader source changed (tools/ci-changes.sh).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: github.event_name == 'pull_request'
        with:
          dotnet-version: 10.0.x
      - id: diff
        if: github.event_name == 'pull_request'
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"

  realworld:
    if: needs.changes.outputs.light != 'true'
    needs: changes
    name: Real world (${{ matrix.video }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        video:
          - bbb_640x360_h264.mp4
          - elephants_dream_426x240_h264.mp4
          - tears_of_steel_1280x534_h264.mov
          - bbb_10s_h264.mp4 bbb_10s_h265.mp4 bbb_10s_vp9.webm   # 10 s clips: one job (a minute's setup for each otherwise)
          # Not bbb_10s_av1.mp4: OpenCV's Linux wheel has no software AV1 decoder (it opens the file and
          # reads 0 frames), so scenedetect has nothing to compare with here. It matches on Windows.
    env:
      FFMPEG: '9.0'   # the latest stable FFmpeg; BtbN's static build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: needs.changes.outputs.docs_only != 'true'
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          python-version: '3.12'

      - name: Install ffmpeg ${{ env.FFMPEG }}
        if: needs.changes.outputs.docs_only != 'true'
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          version: ${{ env.FFMPEG }}

      - name: Install scenedetect
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install scenedetect==0.7.2 opencv-python-headless==5.0.0.93

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: dotnet build src/ShotDetector.Cli -c Release

      - name: Cache the video
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-${{ matrix.video }}-${{ hashFiles('tools/realworld.py') }}

      - name: Compare with scenedetect
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          python tools/realworld.py ${{ matrix.video }} --report realworld.md || status=$?
          { echo "### ${{ matrix.video }}"; cat realworld.md; } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}

  # Parallel detection (DetectionOptions.Mode) on the long films: --parallel's automatic count (2 chunks on these
  # 4-CPU runners, as the default's) and 4 chunks, byte for byte the
  # sequential result, and never falling back to sequential. In-process,
  # with FFmpeg 8.1's libraries, and the automatic count through the same build's ffmpeg executable (a process per chunk).
  parallel:
    if: needs.changes.outputs.light != 'true'
    needs: changes
    name: Real world parallel
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      FILMS: bbb_640x360_h264.mp4 elephants_dream_426x240_h264.mp4 tears_of_steel_1280x534_h264.mov
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: FFmpeg 8.1, shared
        id: ffmpeg
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared
          add-to-path: 'false'

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-bbb_640x360_h264.mp4-${{ hashFiles('tools/realworld.py') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-elephants_dream_426x240_h264.mp4-${{ hashFiles('tools/realworld.py') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-tears_of_steel_1280x534_h264.mov-${{ hashFiles('tools/realworld.py') }}

      - name: Parallel against sequential
        env:
          SHOTDETECTOR_OURS_ARGS: --decoder inprocess --ffmpeg-dir ${{ steps.ffmpeg.outputs.bin }}
        run: |
          films=$(python3 tools/realworld.py $FILMS --download | tail -3)
          status=0
          python3 tools/compare-parallel.py $films --require-chunks --report auto.md || status=$?
          python3 tools/compare-parallel.py $films --require-chunks --chunks 4 --report four.md || status=$?
          { echo "### Parallel against sequential, --parallel ($(nproc) CPUs)"; cat auto.md; echo "### 4 chunks"; cat four.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Parallel against sequential, ffmpeg executable
        if: ${{ !cancelled() }}
        env:
          SHOTDETECTOR_OURS_ARGS: --decoder process --ffmpeg-dir ${{ steps.ffmpeg.outputs.bin }}
        run: |
          films=$(python3 tools/realworld.py $FILMS --download | tail -3)
          status=0
          python3 tools/compare-parallel.py $films --require-chunks --report process.md || status=$?
          { echo "### Parallel against sequential through the ffmpeg executable, --parallel ($(nproc) CPUs)"; cat process.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # FrameReader's AudioReader and SpectralStats on the films' own audio (AAC at 44.1 and 48 kHz, MP3, Opus, Vorbis) against
  # ffmpeg's command line (tests/FrameReader.Tests/RealWorldAudioTests.cs), one file after another in one job (five
  # jobs before, each mostly setup). Libraries and executable from one FFmpeg 8.1 build.
  audio:
    if: needs.changes.outputs.docs_only != 'true'
    needs: changes
    name: Real world audio
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      FILMS: bbb_640x360_h264.mp4 elephants_dream_426x240_h264.mp4 tears_of_steel_1280x534_h264.mov   # AAC 44.1 and 48 kHz, MP3
      OPUS: elephants_dream_1920x1080_vp9.webm going_some_1909.opus maple_leaf_rag.ogg   # 5.1 Opus (Commons' copy, Matroska's ms timestamps); stereo Opus; stereo Vorbis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: FFmpeg 8.1, shared
        id: ffmpeg
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          build: gpl-shared
          add-to-path: 'false'

      # The Opus files, cached here (restored and saved before the films join the folder); the films from the caches the
      # jobs above keep (downloaded on a miss, not saved again here).
      - id: opus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-opus-${{ hashFiles('tools/realworld.py') }}

      - name: Download the Opus files
        if: steps.opus.outputs.cache-hit != 'true'
        run: python3 tools/realworld.py $OPUS --download

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.opus.outputs.cache-hit != 'true'
        with:
          path: samples/realworld
          key: ${{ steps.opus.outputs.cache-primary-key }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-bbb_640x360_h264.mp4-${{ hashFiles('tools/realworld.py') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-elephants_dream_426x240_h264.mp4-${{ hashFiles('tools/realworld.py') }}

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: samples/realworld
          key: realworld-tears_of_steel_1280x534_h264.mov-${{ hashFiles('tools/realworld.py') }}

      - name: Compare with ffmpeg
        env:
          SHOTDETECTOR_FFMPEG_LIBS: ${{ steps.ffmpeg.outputs.bin }}
        run: |
          dotnet build tests/FrameReader.Tests -v q > /dev/null
          status=0
          for f in $FILMS $OPUS; do
            echo "::group::$f"
            export SHOTDETECTOR_REALWORLD_AUDIO=$(python3 tools/realworld.py "$f" --download | tail -1)
            if dotnet test tests/FrameReader.Tests --no-build --filter "FullyQualifiedName~RealWorldAudio" --logger GitHubActions; then r=identical; else r=DIFFERS; status=1; fi
            echo "::endgroup::"
            echo "| $f | $r |" >> results.md
          done
          { echo "### Real world audio"; echo; echo "| File | AudioReader, SpectralStats vs ffmpeg |"; echo "|---|---|"; cat results.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The one check branch protection requires from this workflow: every job above passed or was skipped (a light PR
  # skips the heavy ones, and a skipped matrix job doesn't report its per-matrix check names).
  passed:
    name: Real world passed
    needs: [changes, realworld, audio, parallel]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
