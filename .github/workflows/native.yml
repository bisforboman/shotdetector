name: Native libraries

# FFmpeg's shared libraries for FrameReader.Native.<rid> (tools/native/build-ffmpeg.sh), one job per platform,
# cached by the hash of the script and this workflow: rebuilt only when the FFmpeg version, the configure line or how
# they're built changes.
# release.yml and the tests take them from here (workflow_call), as artifacts native-<rid>.
on:
  workflow_call:
    inputs:
      rids:
        description: JSON array of the platforms to build (default all)
        type: string
        default: '["win-x64","linux-x64","linux-arm64","linux-musl-x64","osx-arm64"]'
  workflow_dispatch:
  pull_request:
    paths: ['tools/native/**', '.github/workflows/native.yml']

# The token only reads the repository.
permissions:
  contents: read

jobs:
  # The platforms asked for (all by default), as the build job's matrix: a job-level `if` can't see `matrix`, and
  # this way the platforms not asked for don't start a runner at all.
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          RIDS: ${{ inputs.rids || '["win-x64","linux-x64","linux-arm64","linux-musl-x64","osx-arm64"]' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          all = [
              {"rid": "win-x64", "os": "ubuntu-22.04"},          # cross-compiled with mingw-w64
              {"rid": "linux-x64", "os": "ubuntu-22.04"},        # an older glibc, so the libraries load on more systems
              {"rid": "linux-arm64", "os": "ubuntu-22.04-arm"},
              {"rid": "linux-musl-x64", "os": "ubuntu-26.04", "alpine": "3.20"},  # built in an Alpine container (docker run)
              {"rid": "osx-arm64", "os": "macos-14"},
          ]
          wanted = json.loads(os.environ["RIDS"])
          print("include=" + json.dumps([p for p in all if p["rid"] in wanted]))
          EOF

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: native
          key: ffmpeg-${{ matrix.rid }}-${{ hashFiles('tools/native/build-ffmpeg.sh', '.github/workflows/native.yml') }}

      - name: Tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && !matrix.alpine && runner.os == 'Linux'
        timeout-minutes: 10   # package mirrors sometimes hang
        run: sudo apt-get -o Acquire::Retries=3 update -q && sudo apt-get install -y -q -o Acquire::Retries=3 nasm meson ninja-build pkg-config patchelf ${{ matrix.rid == 'win-x64' && 'mingw-w64' || '' }}

      - name: Tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install meson ninja pkgconf

      # Alpine (musl) runs with docker run rather than as the job's container, which the runner pulls once, before any
      # step: public.ecr.aws once answered "Data limit exceeded" three times and stopped a release. Here a pull that
      # fails is retried, then taken from Google's Docker Hub mirror or Docker Hub itself.
      - name: Alpine image
        id: alpine
        if: steps.cache.outputs.cache-hit != 'true' && matrix.alpine
        timeout-minutes: 10
        run: |
          for round in 1 2 3; do
            for registry in public.ecr.aws/docker/library mirror.gcr.io/library docker.io/library; do
              image="$registry/alpine:${{ matrix.alpine }}"
              if docker pull -q "$image"; then echo "image=$image" >> "$GITHUB_OUTPUT"; exit 0; fi
            done
            sleep 30
          done
          echo "::error::No registry gave alpine:${{ matrix.alpine }}"
          exit 1

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true' && !matrix.alpine
        run: sh tools/native/build-ffmpeg.sh ${{ matrix.rid }} native

      - name: Build FFmpeg (Alpine)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ steps.alpine.outputs.image }}" sh -c '
            apk add --no-cache build-base linux-headers nasm curl tar xz git perl coreutils meson samurai pkgconf patchelf > /dev/null &&
            sh tools/native/build-ffmpeg.sh ${{ matrix.rid }} native'

      - name: What the libraries link against
        shell: sh
        run: |
          ls -l native
          python3 -c "import json, sys; d = json.load(open('native/sbom.spdx.json')); print(d['name'], [p['name'] + ' ' + p['versionInfo'] for p in d['packages']])"
          case "${{ matrix.rid }}" in
            win-x64) command -v x86_64-w64-mingw32-objdump > /dev/null && for f in native/*.dll; do echo "$f:"; x86_64-w64-mingw32-objdump -p "$f" | grep "DLL Name"; done || true ;;
            osx-*) for f in native/*.dylib; do otool -L "$f"; done ;;
            *) for f in native/*.so.*; do echo "$f:"; readelf -d "$f" | grep -E "NEEDED|RUNPATH|SONAME"; done ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.rid }}
          path: native/
