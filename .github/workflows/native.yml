name: Native libraries

# FFmpeg's shared libraries for ShotDetector.Native.<rid> (tools/native/build-ffmpeg.sh), one job per platform,
# cached by the script's hash: they are rebuilt only when the FFmpeg version or the configure line changes.
# release.yml and the tests take them from here (workflow_call). Two variants: lgpl (ShotDetector.Native, artifact
# native-<rid>) and gpl (with x264, ShotDetector.Native.Gpl, artifact native-gpl-<rid>).
on:
  workflow_call:
    inputs:
      rids:
        description: JSON array of the platforms to build (default all)
        type: string
        default: '["win-x64","linux-x64","linux-arm64","linux-musl-x64","osx-arm64"]'
      variants:
        description: JSON array of the variants to build (lgpl, gpl)
        type: string
        default: '["lgpl"]'
  workflow_dispatch:
  pull_request:
    paths: ['tools/native/**', '.github/workflows/native.yml']

jobs:
  # The platforms asked for (all by default), as the build job's matrix: a job-level `if` can't see `matrix`, and
  # this way the platforms not asked for don't start a runner at all.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          RIDS: ${{ inputs.rids || '["win-x64","linux-x64","linux-arm64","linux-musl-x64","osx-arm64"]' }}
          # A pull request changing the build script (or a manual run) builds both variants.
          VARIANTS: ${{ inputs.variants || '["lgpl","gpl"]' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          all = [
              {"rid": "win-x64", "os": "ubuntu-22.04"},          # cross-compiled with mingw-w64
              {"rid": "linux-x64", "os": "ubuntu-22.04"},        # an older glibc, so the libraries load on more systems
              {"rid": "linux-arm64", "os": "ubuntu-22.04-arm"},
              {"rid": "linux-musl-x64", "os": "ubuntu-latest", "container": "public.ecr.aws/docker/library/alpine:3.20"},  # Docker Hub rate-limits
              {"rid": "osx-arm64", "os": "macos-14"},
          ]
          wanted = json.loads(os.environ["RIDS"])
          variants = json.loads(os.environ["VARIANTS"])
          print("include=" + json.dumps([{**p, "variant": v, "artifact": f"native-{'gpl-' if v == 'gpl' else ''}{p['rid']}"}
                                          for p in all if p["rid"] in wanted for v in variants]))
          EOF

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    container: ${{ matrix.container }}
    steps:
      - name: Tools (Alpine)
        if: matrix.container
        timeout-minutes: 10   # package mirrors sometimes hang
        run: apk add --no-cache build-base nasm curl tar xz git perl coreutils meson samurai pkgconf

      - uses: actions/checkout@v7

      - uses: actions/cache@v5
        id: cache
        with:
          path: native
          key: ffmpeg-${{ matrix.variant == 'gpl' && 'gpl-' || '' }}${{ matrix.rid }}-${{ hashFiles('tools/native/build-ffmpeg.sh') }}

      - name: Tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && !matrix.container && runner.os == 'Linux'
        timeout-minutes: 10   # package mirrors sometimes hang
        run: sudo apt-get -o Acquire::Retries=3 update -q && sudo apt-get install -y -q -o Acquire::Retries=3 nasm meson ninja-build pkg-config ${{ matrix.rid == 'win-x64' && 'mingw-w64' || '' }}

      - name: Tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install meson ninja pkgconf

      - name: Build FFmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: sh tools/native/build-ffmpeg.sh ${{ matrix.rid }} native ${{ matrix.variant }}

      - name: What the libraries link against
        shell: sh
        run: |
          ls -l native
          case "${{ matrix.rid }}" in
            win-x64) command -v x86_64-w64-mingw32-objdump > /dev/null && for f in native/*.dll; do echo "$f:"; x86_64-w64-mingw32-objdump -p "$f" | grep "DLL Name"; done || true ;;
            osx-*) for f in native/*.dylib; do otool -L "$f"; done ;;
            *) for f in native/*.so.*; do echo "$f:"; readelf -d "$f" | grep -E "NEEDED|RUNPATH|SONAME"; done ;;
          esac

      - name: The gpl variant has libx264
        if: matrix.variant == 'gpl'
        shell: sh
        run: grep -q -- "--enable-libx264" native/configure.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: native/
