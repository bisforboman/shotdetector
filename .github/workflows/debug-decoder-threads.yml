name: Debug decoder threads

# Throwaway (debug/** branch): sequential shotdetect at the new default decoder threads against --threads <CPUs>
# (OpenCV's count, the old default), interleaved on one runner, for PR #734. Delete the branch afterwards.
on:
  push:
    branches: ['debug/decoder-threads']

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      rids: '["linux-x64","linux-arm64"]'

  time:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-26.04, btbn: linux64 }
          - { rid: linux-arm64, os: ubuntu-26.04-arm, btbn: linuxarm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install ffmpeg 9.0
        timeout-minutes: 15
        uses: ./.github/actions/btbn-ffmpeg
        with:
          version: '9.0'
          platform: ${{ matrix.btbn }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}

      - name: Build
        run: dotnet build src/ShotDetector.Cli -c Release

      - name: Cache the videos
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: samples/realworld
          key: realworld-films-${{ hashFiles('tools/realworld.py') }}

      - name: Time
        run: |
          films="sintel_trailer_1920x1080_h264.mp4 tears_of_steel_1280x534_h264.mov bbb_640x360_h264.mp4 elephants_dream_426x240_h264.mp4"
          python tools/realworld.py $films --download
          echo "### ${{ matrix.rid }}: $(nproc) CPUs ($(lscpu | sed -n 's/^Model name: *//p' | head -1))" >> "$GITHUB_STEP_SUMMARY"
          python tools/time_threads.py $(for f in $films; do echo samples/realworld/$f; done) 5 "$GITHUB_STEP_SUMMARY"
