name: Upstream releases

# Weekly: an issue when something ShotDetector matches or builds on has a newer release than the one it uses: scenedetect
# (a new compatibility mode), FFmpeg's point releases in our native build's series, and zlib and dav1d, which that build
# links in (security and decoder fixes reach ShotDetector.Native and the CLI only when the build moves). One issue per
# release (none if one exists, open or closed).
on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  scenedetect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: A newer scenedetect on PyPI?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version CI compares against (the real-world workflow pins it; ci.yml's parity matrix has the same).
          ours=$(grep -oE 'scenedetect==[0-9][0-9.]*' .github/workflows/realworld.yml | head -1 | cut -d= -f3)
          latest=$(curl -fsSL --retry 3 https://pypi.org/pypi/scenedetect/json | jq -r .info.version)
          echo "ShotDetector matches scenedetect $ours; PyPI's newest release is $latest."
          # Releases only (X.Y.Z): a dev or rc version doesn't count.
          newer=$(python3 -c 'import sys; v = lambda s: tuple(int(x) for x in s.split(".")); print(v(sys.argv[2]) > v(sys.argv[1]))' "$ours" "$latest" 2>/dev/null || echo False)
          [ "$newer" = True ] || exit 0
          title="scenedetect $latest released"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already filed: $title"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          PyPI has scenedetect $latest; ShotDetector matches $ours (found by the weekly upstream check).

          Release notes: https://github.com/Breakthrough/PySceneDetect/releases (and https://pypi.org/project/scenedetect/$latest/).

          To support it (README "Versions": the default compatibility mode tracks the newest scenedetect, a minor version):
          - [ ] Read the release notes for changes to detection, downscaling, frame rates, timecodes, CSV/stats output or the CLI.
          - [ ] Compare: \`pip install scenedetect==$latest\`, then \`python tools/compare.py samples/*.mp4 ... --detector all --stats\` and the real-world films.
          - [ ] For each difference: reproduce it as a new \`PySceneDetectVersion\` value (default), keeping $ours selectable; tests and mutation lines for new quirks.
          - [ ] Move the pins (\`scenedetect==\` in ci.yml's parity matrix, realworld.yml, benchmark.yml) and the docs.
          EOF
          )"

  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: A newer FFmpeg point release?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version our native libraries are built from, and its series (8.1.3 -> 8.1): point releases only, a new
          # major or minor is a decision of its own (the backlog's FFmpeg 9 row).
          ours=$(sed -n 's/^VERSION=//p' tools/native/build-ffmpeg.sh)
          series=${ours%.*}
          latest=$(curl -fsSL --retry 3 https://ffmpeg.org/releases/ | grep -oE "ffmpeg-${series}[.][0-9]+[.]tar[.]xz" \
            | grep -oE '[0-9]+[.][0-9]+[.][0-9]+' | sort -V | tail -1)
          echo "Our native build is FFmpeg $ours; the newest $series release is ${latest:-unknown}."
          newer=$(python3 -c 'import sys; v = lambda s: tuple(int(x) for x in s.split(".")); print(v(sys.argv[2]) > v(sys.argv[1]))' "$ours" "${latest:-0}" 2>/dev/null || echo False)
          [ "$newer" = True ] || exit 0
          title="FFmpeg $latest released"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already filed: $title"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          FFmpeg $latest is out; our native libraries (ShotDetector.Native.<rid>, the CLI) are built from $ours (found by the weekly upstream check).

          Changes: https://git.ffmpeg.org/gitweb/ffmpeg.git/shortlog/refs/tags/n$latest (security fixes are listed at https://ffmpeg.org/security.html).

          To move to it:
          - [ ] In \`tools/native/build-ffmpeg.sh\`: \`VERSION=$latest\` and its \`SHA256\` (of https://ffmpeg.org/releases/ffmpeg-$latest.tar.xz, checked against its .asc signature).
          - [ ] The PR rebuilds the libraries for every platform (native.yml, keyed by the script's hash) and runs the in-process, parity and real-world checks on them.
          - [ ] Update the version in the Native package description, its README and THIRD-PARTY-NOTICES.md, and the CHANGELOG (a patch release).
          EOF
          )"

  # zlib and dav1d, linked statically into our FFmpeg libraries: any newer release than build-ffmpeg.sh's.
  libraries:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: zlib, var: ZLIB, index: 'https://zlib.net/fossils/', pattern: 'zlib-[0-9]+([.][0-9]+)+[.]tar[.]gz', notes: 'https://zlib.net/ChangeLog.txt', url: 'https://zlib.net/fossils/zlib-$V.tar.gz' }
          - { name: dav1d, var: DAV1D, index: 'https://downloads.videolan.org/pub/videolan/dav1d/', pattern: 'href="[0-9]+([.][0-9]+)+/"', notes: 'https://code.videolan.org/videolan/dav1d/-/releases', url: 'https://downloads.videolan.org/pub/videolan/dav1d/$V/dav1d-$V.tar.xz' }
    steps:
      - uses: actions/checkout@v7

      - name: A newer ${{ matrix.name }}?
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
          INDEX: ${{ matrix.index }}
          PATTERN: ${{ matrix.pattern }}
          NOTES: ${{ matrix.notes }}
          URL: ${{ matrix.url }}
        run: |
          ours=$(sed -n 's/^${{ matrix.var }}=//p' tools/native/build-ffmpeg.sh)
          latest=$(curl -fsSL --retry 3 "$INDEX" | grep -oE "$PATTERN" | grep -oE '[0-9]+([.][0-9]+)+' | sort -V | tail -1)
          echo "Our native build links $NAME $ours; the newest release is ${latest:-unknown}."
          newer=$(python3 -c 'import sys; v = lambda s: tuple(int(x) for x in s.split(".")); print(v(sys.argv[2]) > v(sys.argv[1]))' "$ours" "${latest:-0}" 2>/dev/null || echo False)
          [ "$newer" = True ] || exit 0
          title="$NAME $latest released"
          if gh issue list --state all --search "\"$title\" in:title" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already filed: $title"
            exit 0
          fi
          source=${URL//'$V'/$latest}
          gh issue create --title "$title" --body "$(cat <<EOF
          $NAME $latest is out; our native libraries (ShotDetector.Native.<rid>, the CLI) link $ours in statically (found by the weekly upstream check).

          Changes: $NOTES

          To move to it:
          - [ ] In \`tools/native/build-ffmpeg.sh\`: \`${{ matrix.var }}=$latest\` and \`${{ matrix.var }}_SHA256\` (of $source).
          - [ ] The PR rebuilds the libraries for every platform (native.yml, keyed by the script's hash) and runs the in-process, parity and real-world checks on them.
          - [ ] Update the version in the Native README and THIRD-PARTY-NOTICES.md (and its copyright years), and the CHANGELOG (a patch release).
          EOF
          )"
